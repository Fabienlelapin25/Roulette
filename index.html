<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Machine à Sous Destiny 2 - avec sélection</title>
  <meta name="viewport" content="width=400, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: none;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      color: #00000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container { display: flex; gap: 32px; align-items: flex-start; }
    .slot-machine {
      position: relative;
      border-radius: 28px;
      box-shadow: 0 8px 40px 10px #0004;
      padding: 36px 26px 32px 26px;
      width: 330px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid #fff;
      overflow: hidden;
      background: transparent;
    }
    .slot-machine::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(135deg, #9038a3cc 0%, #7b2ff2cc 60%, #00c6ffcc 100%);
      opacity: 0.55;
    }
    .slot-machine > * {
      position: relative;
      z-index: 1;
    }
    .slot-machine::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      pointer-events: none;
      border: 2px solid rgba(255,255,255,0.18);
      z-index: 2;
    }
    .weapon-label {
      margin-bottom: 18px;
      font-size: 1.18em;
      letter-spacing: 1.5px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 2px 8px #7b2ff280, 0 1px 5px #0008;
      text-align: center;
      min-height: 1.4em;
    }
    .reel-viewport {
      width: 170px;
      height: 170px;
      overflow: hidden;
      border-radius: 16px;
      margin-bottom: 20px;
      border: 4px solid #fff;
      background: none;
      box-shadow: 0 0 40px 0 #a282e0a0;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.4s;
    }
    .reel-strip {
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }
    .reel-item {
      height: 170px;
      width: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .reel-item img {
      max-width: 120px;
      max-height: 120px;
      width: 120px;
      height: 120px;
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 2px 18px #a282e080;
      display: block;
      margin: 0 auto;
      background: #e3e3ff;
      object-fit: contain;
      border: 2px solid #8888aa;
    }
    .reel-item .reel-name { display: none !important; }
    .reel-item.selected .reel-name { display: none !important; }
    .btn-spin {
      background: linear-gradient(90deg, #fff 0%, #e3aaff 100%);
      color: #7b2ff2;
      font-size: 1.25em;
      border: none;
      border-radius: 12px;
      padding: 15px 55px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      margin-top: 20px;
      box-shadow: 0 3px 16px #fff4, 0 1.5px 8px #9038a340;
      letter-spacing: 2px;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    }
    .btn-spin:active {
      background: linear-gradient(90deg, #e3aaff 0%, #fff 100%);
      color: #4c33a3;
      box-shadow: 0 0 0 transparent;
    }
    .btn-spin:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .picked {
      animation: pop 0.4s;
    }
    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }
    /* Panel sélection */
    .panel {
      width: 290px;
      background: linear-gradient(180deg, #fff, #fbfbfb);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
      max-height: 560px;
      overflow-y: auto;
    }
    .panel h3 { margin: 0 0 12px 0; font-size: 16px; }
    .list-controls { display: flex; gap: 8px; margin-bottom: 12px; }
    .list-controls button { padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.06); background: #fff; cursor: pointer; font-weight: 600; font-size: 12px; }
    .list-controls button:hover { background: #f5f5f5; }
    #countSelected { margin-left: auto; color: #6b6b76; font-weight: 600; }
    .weapons-list { list-style: none; padding: 0; margin: 0; }
    .weapons-list li { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid rgba(0,0,0,0.04); }
    .weapons-list li:hover { background: rgba(0,0,0,0.02); }
    .weapons-list input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .weapons-list .name { font-weight: 700; font-size: 13px; cursor: pointer; }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      .container { flex-direction: column; }
      .panel { width: 100%; max-height: 400px; }
    }
    @media (max-width: 430px) {
      .slot-machine { width: 99vw; padding: 16vw 2vw 10vw 2vw; }
      .weapon-label { font-size: 1em; }
      .reel-viewport, .reel-item { width: 40vw; height: 40vw; min-width: 110px; min-height: 110px; }
      .reel-item img { max-width: 80vw; max-height: 80vw; }
      .panel { max-height: 300px;}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="slot-machine">
      <div class="weapon-label" id="weapon-label"></div>
      <div class="reel-viewport" id="reel-viewport">

      </div>
      <button class="btn-spin" id="spin-btn">SPIN</button>
    </div>

    <div class="panel">
      <h3>Liste des armes</h3>
      <div class="list-controls">
        <button id="checkAll">Tout cocher</button>
        <button id="uncheckAll">Tout décocher</button>
        <span id="countSelected">0</span>
      </div>

      <!-- 🔍 Barre de recherche -->
      <input type="text" id="searchBar" placeholder="Rechercher une arme..." 
             style="width:100%;padding:8px;margin-bottom:12px;border-radius:8px;border:1px solid #ccc;">

      <!-- 🎲 Sélection aléatoire -->
      <div class="random-select" style="margin-bottom:12px; display:flex; gap:8px;">
        <input type="number" id="randomCount" min="1" placeholder="Nombre aléatoire" 
               style="flex:1; padding:8px; border-radius:8px; border:1px solid #ccc;">
        <button id="randomBtn">Sélection aléatoire</button>
      </div>
  
      <ul id="weapons-list" class="weapons-list"></ul>
    </div>
  </div>

    weapons.forEach((w,i)=>{ w.id = 'w'+(i+1); w.checked = true; });

      // ======== DOM ========
    const reelStrip = document.getElementById('reel-strip');
    const weaponLabel = document.getElementById('weapon-label');
    const spinBtn = document.getElementById('spin-btn');
    const reelViewport = document.getElementById('reel-viewport');

    const weaponsListEl = document.getElementById('weapons-list');
    const checkAllBtn = document.getElementById('checkAll');
    const uncheckAllBtn = document.getElementById('uncheckAll');
    const countSelectedEl = document.getElementById('countSelected');

    // 🔍 Barre de recherche
    const searchBar = document.getElementById('searchBar');
    let searchQuery = "";

    // 🎲 Sélection aléatoire
    const randomCountInput = document.getElementById('randomCount');
    const randomBtn = document.getElementById('randomBtn');

    let spinning = false;

    // ======== PANEL SELECTION ========
    function getSelected() { return weapons.filter(w => w.checked); }
    function renderWeaponsList() {
      weaponsListEl.innerHTML = '';
      const sorted = weapons.slice().sort((a,b) => a.name.localeCompare(b.name,'fr',{sensitivity:'base'}));
      sorted
        .filter(w => w.name.toLowerCase().includes(searchQuery.toLowerCase())) // filtre par recherche
        .forEach(w => {
          const li = document.createElement('li');
          const cb = document.createElement('input');
          cb.type = 'checkbox'; cb.id = 'cb-'+w.id; cb.checked=w.checked;
          cb.addEventListener('change',()=>{ w.checked=cb.checked; renderStrip(); updateCount(); });
          const label = document.createElement('label');
          label.htmlFor = cb.id;
          label.className = 'name';
          label.textContent = w.name;
          label.style.cursor = 'pointer';
          li.appendChild(cb); li.appendChild(label); weaponsListEl.appendChild(li);
        });
      updateCount();
    }
    checkAllBtn.addEventListener('click',()=>{ weapons.forEach(w=>w.checked=true); renderWeaponsList(); renderStrip(); });
    uncheckAllBtn.addEventListener('click',()=>{ weapons.forEach(w=>w.checked=false); renderWeaponsList(); renderStrip(); });
    function updateCount(){ countSelectedEl.textContent=getSelected().length; spinBtn.disabled=(getSelected().length===0); }

    // 🔍 Écoute la saisie dans la barre de recherche
    searchBar.addEventListener('input', () => {
      searchQuery = searchBar.value;
      renderWeaponsList();
    });

    // 🎲 Sélection aléatoire d’un nombre d’armes
    randomBtn.addEventListener('click', () => {
      let n = parseInt(randomCountInput.value);
      if (isNaN(n) || n <= 0) return;

      // Réinitialiser toutes les cases
      weapons.forEach(w => w.checked = false);

      // Mélanger les armes
      const shuffled = weapons.slice().sort(() => Math.random() - 0.5);

      // Cocher les n premières
      shuffled.slice(0, n).forEach(w => w.checked = true);

      // Rafraîchir l’affichage
      renderWeaponsList();
      renderStrip();
    });

    // ======== ROULETTE ========
    function renderStrip(repeat=2) {
      const selected=getSelected();
      if(selected.length===0){
        reelStrip.innerHTML='<div class="reel-item"><div style="color:#fff;font-weight:700">Aucune arme sélectionnée</div></div>';
        spinBtn.disabled=true;
        weaponLabel.textContent='';
        return;
      }
      reelStrip.innerHTML='';
      for(let r=0;r<repeat;r++){
        selected.forEach(w=>{
          const div=document.createElement('div');
          div.className='reel-item';
          div.innerHTML=`<img src="${w.img}" alt="${w.name}"><div class="reel-name"></div>`;
          reelStrip.appendChild(div);
        });
      }
      spinBtn.disabled=false;
    }
    function setLabelFromStrip(pos) {
      const selected=getSelected();
      if(selected.length===0){ weaponLabel.textContent=''; return 0;}
      let idx=Math.round(pos/170)%selected.length;
      if(idx<0) idx+=selected.length;
      weaponLabel.textContent=selected[idx].name;
      document.querySelectorAll('.reel-item').forEach(e => e.classList.remove('selected'));
      const items=document.querySelectorAll('.reel-item');
      for(let i=0;i<items.length;i++){
        if(i%selected.length===idx){ items[i].classList.add('selected'); break;}
      }
      return idx;
    }
    function resetReel() {
      renderStrip();
      reelStrip.style.transform=`translateY(0px)`;
      setLabelFromStrip(0);
    }
    function showPickedWeapon(idx){
      const selected=getSelected();
      reelViewport.innerHTML='';
      const picked=document.createElement('div');
      picked.className='reel-item picked';
      picked.innerHTML=`<img src="${selected[idx].img}" alt="${selected[idx].name}">`;
      reelViewport.appendChild(picked);
    }
    function spin() {
      if(spinning) return;
      const selected=getSelected(); if(selected.length===0) return;
      spinning=true;
      spinBtn.disabled=true; spinBtn.style.opacity="0.65";
      const finalIdx=Math.floor(Math.random()*selected.length);
      let stepHeight=170;
      let nCycles=7+Math.floor(Math.random()*3);
      let totalMoves=(nCycles*selected.length+finalIdx)*stepHeight;
      let duration=2200; let start=null;

      function easeOutCubic(t){return 1-Math.pow(1-t,3);}
      function animate(ts){
        if(!start) start=ts;
        let elapsed=ts-start;
        let progress=Math.min(elapsed/duration,1);
        let eased=easeOutCubic(progress);
        let pos=-eased*totalMoves;
        let visualPos=(pos%(selected.length*stepHeight));
        if(visualPos>0) visualPos-=selected.length*stepHeight;
        reelStrip.style.transform=`translateY(${visualPos}px)`;
        setLabelFromStrip(-visualPos);
        if(progress<1){ requestAnimationFrame(animate);}
        else {
          let finalPos=-finalIdx*stepHeight;
          reelStrip.style.transform=`translateY(${finalPos}px)`;
          setLabelFromStrip(finalIdx*stepHeight);
          setTimeout(()=>{
            showPickedWeapon(finalIdx);
            weaponLabel.textContent=getSelected()[finalIdx].name;
            spinBtn.disabled=false;
            spinBtn.style.opacity="1";
            spinning=false;
          },100);
        }
      }
      resetReel();
      reelViewport.innerHTML = `<div class="reel-strip" id="reel-strip"></div>`;
      document.getElementById('reel-strip').replaceWith(reelStrip);
      requestAnimationFrame(animate);
    }
    spinBtn.addEventListener('click',spin);

    // ======== INIT ========
    resetReel();
    renderWeaponsList();
  </script>
