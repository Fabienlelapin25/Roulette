<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Destiny 2 - Loadout Manager | Roulette Ultime</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0e;
      font-family: 'Segoe UI', 'Rajdhani', monospace;
      height: 100vh;
      overflow: hidden;
      color: #c8c8d8;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    /* ===== BANNIÈRE SUPÉRIEURE ===== */
    .players-banner {
      background: #0c0c10;
      border-bottom: 1px solid #2a2a35;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 90px;
    }
    .players-list {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      flex: 1;
    }
    .player-card {
      background: #14141c;
      border: 1px solid #3a3a48;
      min-width: 180px;
      padding: 8px 12px;
      position: relative;
      transition: 0.15s;
    }
    .player-card.drag-over {
      border-color: #aa88ff;
      background: #1c1c28;
      box-shadow: 0 0 10px rgba(170, 136, 255, 0.2);
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2a2a35;
    }
    .player-name {
      font-weight: bold;
      color: #aa88ff;
      font-size: 13px;
      text-transform: uppercase;
    }
    .remove-player {
      background: none;
      border: none;
      color: #6a6a7a;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
    }
    .remove-player:hover { color: #ff8888; }
    .player-items {
      min-height: 60px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .player-item {
      background: #1a1a24;
      border-left: 2px solid #aa88ff;
      padding: 4px 8px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
    }
    .player-item:active { cursor: grabbing; }
    .remove-item {
      background: none;
      border: none;
      color: #6a6a7a;
      cursor: pointer;
      font-size: 12px;
    }
    .remove-item:hover { color: #ff8888; }
    .empty-player {
      color: #6a6a7a;
      font-size: 10px;
      text-align: center;
      padding: 12px;
      font-style: italic;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .add-player-btn, .export-png-btn {
      background: #14141c;
      border: 1px solid #3a3a48;
      color: #aa88ff;
      padding: 8px 16px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      transition: 0.15s;
      white-space: nowrap;
    }
    .add-player-btn:hover, .export-png-btn:hover {
      background: #1c1c26;
      border-color: #8866cc;
    }
    .export-png-btn { background: #1a1a2a; border-color: #8866cc; }
    /* ===== CONTENU PRINCIPAL ===== */
    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    /* PANEL GAUCHE - Catégories */
    .roulettes-panel {
      width: 260px;
      background: #0f0f14;
      border-right: 1px solid #2a2a35;
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a35;
      background: #0c0c10;
    }
    .panel-header h2 {
      font-size: 12px;
      color: #aa88ff;
      letter-spacing: 2px;
    }
    .roulettes-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .roulette-item {
      background: #14141c;
      border: 1px solid #2a2a35;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.15s;
    }
    .roulette-item:hover {
      background: #1c1c26;
      border-color: #8866cc;
    }
    .roulette-item.active {
      background: #1a1a24;
      border-left: 3px solid #aa77ff;
    }
    .item-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0e;
      border: 1px solid #3a3a48;
    }
    .item-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .item-title {
      font-size: 13px;
      font-weight: 600;
      color: #d0d0e0;
    }
    .item-sub {
      font-size: 10px;
      color: #88889a;
    }
    /* PANEL CENTRAL - Roulette + Liste */
    .center-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0a0a0e;
      overflow-y: auto;
    }
    .slot-machine {
      text-align: center;
      padding: 24px 24px 16px 24px;
      border-bottom: 1px solid #2a2a35;
    }
    .weapon-label {
      font-size: 14px;
      margin-bottom: 16px;
      color: #aa88ff;
      background: #0f0f14;
      padding: 10px 20px;
      border: 1px solid #2a2a35;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-block;
    }
    .reel-viewport {
      width: 320px;
      height: 540px;
      margin: 0 auto;
      overflow: hidden;
      background: #0f0f14;
      border: 2px solid #3a3a48;
      position: relative;
    }
    /* Ligne centrale fixe (repère visuel) */
    .reel-viewport::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 3px;
      background: #ffcc44;
      transform: translateY(-50%);
      z-index: 5;
      pointer-events: none;
      box-shadow: 0 0 8px #ffcc44;
    }
    .reel-strip {
      display: flex;
      flex-direction: column;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
    }
    .reel-item {
      height: 135px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #14141c;
      gap: 8px;
      border-bottom: 1px solid #2a2a35;
    }
    .reel-item img {
      max-width: 100px;
      max-height: 80px;
      object-fit: contain;
    }
    .reel-item .reel-name {
      font-size: 12px;
      font-weight: bold;
      color: #d0d0e0;
      text-align: center;
      padding: 0 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .reel-item.near-center {
      filter: brightness(1.15);
      box-shadow: 0 0 8px #ffcc4488;
    }
    .reel-item.winner-glow {
      filter: brightness(1.3) drop-shadow(0 0 12px #ffcc44);
      background: linear-gradient(145deg, #3a3e60, #2a2c44);
      transition: all 0.2s ease-out;
    }
    .result-display {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(20, 20, 28, 0.92);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .result-display.active {
      opacity: 1;
      visibility: visible;
    }
    .result-display img {
      max-width: 180px;
      max-height: 180px;
      object-fit: contain;
      animation: zoomExplosion 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    .result-display .result-name {
      font-size: 16px;
      font-weight: bold;
      color: #aa88ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      padding: 0 16px;
      animation: fadeInUp 0.5s ease-out 0.1s both;
    }
    @keyframes zoomExplosion {
      0% { transform: scale(0.2) rotate(-15deg); opacity: 0; filter: blur(4px); }
      40% { transform: scale(1.1) rotate(2deg); }
      70% { transform: scale(0.98); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
    }
    @keyframes fadeInUp {
      0% { transform: translateY(30px); opacity: 0; letter-spacing: 5px; }
      100% { transform: translateY(0); opacity: 1; letter-spacing: 2px; }
    }
    .btn-spin {
      margin-top: 20px;
      background: #14141c;
      border: 2px solid #3a3a48;
      padding: 10px 32px;
      font-size: 14px;
      font-weight: bold;
      color: #aa88ff;
      cursor: pointer;
      font-family: monospace;
      letter-spacing: 4px;
      transition: 0.15s;
    }
    .btn-spin:hover {
      background: #1c1c26;
      border-color: #8866cc;
    }
    .btn-spin:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    /* Liste des éléments */
    .items-section {
      padding: 16px 24px 24px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 250px;
    }
    .items-header {
      margin-bottom: 12px;
    }
    .items-header h3 {
      color: #aa88ff;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .search-bar {
      width: 100%;
      padding: 8px 12px;
      background: #0a0a0e;
      border: 1px solid #3a3a48;
      color: #c8c8d8;
      font-family: monospace;
      font-size: 11px;
      margin-bottom: 10px;
    }
    .search-bar:focus {
      outline: none;
      border-color: #8866cc;
    }
    .list-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .list-controls button {
      background: #14141c;
      border: 1px solid #3a3a48;
      color: #c8c8d8;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 9px;
      font-family: monospace;
      transition: 0.15s;
    }
    .list-controls button:hover {
      background: #1c1c26;
      border-color: #8866cc;
    }
    .count-selected {
      color: #aa88ff;
      font-size: 10px;
      margin-left: auto;
      display: flex;
      align-items: center;
    }
    .items-list {
      flex: 1;
      overflow-y: auto;
      max-height: 200px;
      border: 1px solid #2a2a35;
      background: #0f0f14;
    }
    .item-check {
      background: #14141c;
      border-bottom: 1px solid #2a2a35;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.1s;
    }
    .item-check:hover {
      background: #1c1c26;
    }
    .item-check input {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: #aa88ff;
    }
    .item-check .item-name {
      font-size: 10px;
      font-weight: 500;
      color: #d0d0e0;
      flex: 1;
      text-transform: uppercase;
    }
    /* PANEL DROIT - Historique */
    .history-panel {
      width: 280px;
      background: #0f0f14;
      border-left: 1px solid #2a2a35;
      display: flex;
      flex-direction: column;
    }
    .history-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a35;
      background: #0c0c10;
    }
    .history-header h3 {
      color: #aa88ff;
      font-size: 12px;
      letter-spacing: 2px;
    }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .history-item {
      background: #14141c;
      border: 1px solid #2a2a35;
      padding: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: grab;
      transition: 0.1s;
    }
    .history-item:active { cursor: grabbing; }
    .history-item.dragging { opacity: 0.4; }
    .history-item img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      background: #0a0a0e;
      border: 1px solid #3a3a48;
    }
    .history-info { flex: 1; }
    .history-name {
      font-size: 10px;
      font-weight: 600;
      color: #d0d0e0;
      text-transform: uppercase;
    }
    .history-category {
      font-size: 8px;
      color: #aa88ff;
      text-transform: uppercase;
    }
    .clear-history-btn {
      background: #14141c;
      border: 1px solid #4a3a5a;
      color: #aa88aa;
      padding: 8px;
      cursor: pointer;
      font-size: 10px;
      width: calc(100% - 24px);
      margin: 0 12px 12px 12px;
      text-transform: uppercase;
    }
    .clear-history-btn:hover {
      background: #1c1c26;
      border-color: #ff8888;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0f0f14; }
    ::-webkit-scrollbar-thumb { background: #3a3a48; }
    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #14141c;
      border: 1px solid #8866cc;
      padding: 24px;
      min-width: 300px;
    }
    .modal-content h3 {
      color: #aa88ff;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      background: #0a0a0e;
      border: 1px solid #3a3a48;
      color: #c8c8d8;
      margin-bottom: 16px;
      font-family: monospace;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .modal-buttons button {
      background: #1c1c26;
      border: 1px solid #3a3a48;
      color: #c8c8d8;
      padding: 6px 16px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .modal-buttons button.confirm {
      border-color: #aa88ff;
      color: #aa88ff;
    }
    /* Responsive */
    @media (max-width: 1000px) {
      .history-panel { width: 240px; }
      .reel-viewport { width: 280px; height: 480px; }
      .reel-item { height: 120px; }
    }
    @media (max-width: 900px) {
      .roulettes-panel { width: 220px; }
      .history-panel { width: 220px; }
    }
    @media (max-width: 768px) {
      .main-content { flex-direction: column; }
      .roulettes-panel { width: 100%; max-height: 120px; flex-direction: row; overflow-x: auto; }
      .roulettes-list { flex-direction: row; overflow-x: auto; }
      .roulette-item { min-width: 100px; }
      .history-panel { width: 100%; max-height: 200px; }
      .center-panel { order: 1; }
      .roulettes-panel { order: 2; }
      .history-panel { order: 3; }
      .items-list { max-height: 150px; }
      .reel-viewport { width: 260px; height: 420px; }
      .reel-item { height: 105px; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="players-banner">
    <div class="players-list" id="playersList"></div>
    <div class="button-group">
      <button class="add-player-btn" id="addPlayerBtn">+ AJOUTER JOUEUR</button>
      <button class="export-png-btn" id="exportPngBtn">📸 EXPORTER PNG</button>
    </div>
  </div>
  <div class="main-content">
    <div class="roulettes-panel">
      <div class="panel-header"><h2>CATÉGORIES</h2></div>
      <div class="roulettes-list" id="categoriesList"></div>
    </div>
    <div class="center-panel">
      <div class="slot-machine">
        <div class="weapon-label" id="weaponLabel">SÉLECTIONNE UNE CATÉGORIE</div>
        <div class="reel-viewport" id="reelViewport">
          <div class="reel-strip" id="reelStrip"></div>
          <div class="result-display" id="resultDisplay">
            <img id="resultImg" src="" alt="">
            <div class="result-name" id="resultName"></div>
          </div>
        </div>
        <button class="btn-spin" id="spinBtn" disabled>SPIN</button>
      </div>
      <div class="items-section">
        <div class="items-header">
          <h3>LISTE DES ÉLÉMENTS</h3>
          <input type="text" id="searchBar" class="search-bar" placeholder="RECHERCHER...">
          <div class="list-controls">
            <button id="checkAllBtn">TOUT COCHER</button>
            <button id="uncheckAllBtn">TOUT DÉCOCHER</button>
            <span class="count-selected" id="countSelected">0 sélectionné(s)</span>
          </div>
        </div>
        <div class="items-list" id="itemsList"></div>
      </div>
    </div>
    <div class="history-panel">
      <div class="history-header"><h3>HISTORIQUE (DRAG & DROP)</h3></div>
      <div class="history-list" id="historyList"></div>
      <button class="clear-history-btn" id="clearHistoryBtn">EFFACER L'HISTORIQUE</button>
    </div>
  </div>
</div>
<div class="modal" id="playerModal">
  <div class="modal-content">
    <h3>AJOUTER UN JOUEUR</h3>
    <input type="text" id="playerNameInput" placeholder="Pseudo du gardien" autocomplete="off">
    <div class="modal-buttons">
      <button id="cancelModal">ANNULER</button>
      <button id="confirmModal" class="confirm">AJOUTER</button>
    </div>
  </div>
</div>
<div class="modal" id="confirmModalDialog">
  <div class="modal-content" style="max-width: 300px;">
    <h3>CONFIRMER</h3>
    <p id="confirmMessage">Voulez-vous continuer ?</p>
    <div class="modal-buttons">
      <button id="confirmNo">NON</button>
      <button id="confirmYes" class="confirm">OUI</button>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script>
  // ==================== STORAGE ====================
  const STORAGE_KEYS = { PLAYERS: 'destiny_players', HISTORY: 'destiny_history' };
  const Storage = {
    savePlayers(p) { try { localStorage.setItem(STORAGE_KEYS.PLAYERS, JSON.stringify(p)); return true; } catch(e) { return false; } },
    loadPlayers() { try { const d = localStorage.getItem(STORAGE_KEYS.PLAYERS); return d ? JSON.parse(d) : []; } catch(e) { return []; } },
    saveHistory(h) { try { localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(h.slice(0, 50))); return true; } catch(e) { return false; } },
    loadHistory() { try { const d = localStorage.getItem(STORAGE_KEYS.HISTORY); return d ? JSON.parse(d) : []; } catch(e) { return []; } }
  };

  // ==================== ÉTAT GLOBAL ====================
  let players = [], history = [], currentCategory = null, currentItems = [], nextPlayerId = 1, draggedItem = null, pendingConfirmCallback = null, searchQuery = "";
  let spinning = false, animFrame = null, stopTimeout = null, revealTimeout = null, currentY = 0, velocity = 0, lastTimestamp = 0, deceleration = 0;
  const playersListEl = document.getElementById('playersList'), categoriesListEl = document.getElementById('categoriesList'), itemsListEl = document.getElementById('itemsList');
  const historyListEl = document.getElementById('historyList'), weaponLabel = document.getElementById('weaponLabel'), reelStrip = document.getElementById('reelStrip');
  const reelViewport = document.getElementById('reelViewport'), resultDisplay = document.getElementById('resultDisplay'), resultImg = document.getElementById('resultImg');
  const resultName = document.getElementById('resultName'), spinBtn = document.getElementById('spinBtn'), searchBar = document.getElementById('searchBar');
  const checkAllBtn = document.getElementById('checkAllBtn'), uncheckAllBtn = document.getElementById('uncheckAllBtn'), countSelectedEl = document.getElementById('countSelected');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn'), addPlayerBtn = document.getElementById('addPlayerBtn'), exportPngBtn = document.getElementById('exportPngBtn');
  const playerModal = document.getElementById('playerModal'), confirmDialog = document.getElementById('confirmModalDialog'), playerNameInput = document.getElementById('playerNameInput');
  const cancelModalBtn = document.getElementById('cancelModal'), confirmModalBtn = document.getElementById('confirmModal'), confirmYesBtn = document.getElementById('confirmYes');
  const confirmNoBtn = document.getElementById('confirmNo'), confirmMessage = document.getElementById('confirmMessage');

  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
  function showConfirm(msg, cb) { confirmMessage.textContent = msg; confirmDialog.classList.add('active'); pendingConfirmCallback = cb; }
  function hideConfirm() { confirmDialog.classList.remove('active'); pendingConfirmCallback = null; }
  function updateCount() { const selected = currentItems.filter(i => i.checked); countSelectedEl.textContent = selected.length + ' sélectionné(s)'; spinBtn.disabled = selected.length === 0; }
  function getSelectedItems() { return currentItems.filter(i => i.checked); }

  // ==================== EXPORT PNG (capture du bandeau) ====================
  async function exportToPNG() {
    if (!players.length) { showConfirm('Aucun joueur à exporter !', () => {}); return; }
    const banner = document.querySelector('.players-banner');
    if (!banner) return;
    try {
      const canvas = await html2canvas(banner, { scale: 2, backgroundColor: '#0a0a0e', logging: false, useCORS: true });
      const link = document.createElement('a');
      link.download = `destiny_loadout_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.png`;
      link.href = canvas.toDataURL();
      link.click();
    } catch(err) { console.error(err); showConfirm('Erreur lors de l\'export PNG', () => {}); }
  }

  // ==================== GESTION DES JOUEURS ====================
  function renderPlayers() {
    if (!playersListEl) return;
    if (players.length === 0) { playersListEl.innerHTML = '<div style="color: #6a6a7a; font-size: 12px; padding: 8px;">Aucun joueur - cliquez sur "Ajouter joueur"</div>'; return; }
    playersListEl.innerHTML = players.map(p => `<div class="player-card" data-player-id="${p.id}"><div class="player-header"><span class="player-name">${escapeHtml(p.name)}</span><button class="remove-player" data-id="${p.id}">✕</button></div><div class="player-items" data-player-id="${p.id}">${p.items.length === 0 ? '<div class="empty-player">Déposez ici ▼</div>' : p.items.map((it, idx) => `<div class="player-item" data-item-idx="${idx}" data-item-name="${escapeHtml(it.name)}" data-item-img="${it.img || ''}" data-item-cat="${it.category || ''}" draggable="true"><span>${escapeHtml(it.name)}</span><button class="remove-item" data-player-id="${p.id}" data-item-idx="${idx}">✕</button></div>`).join('')}</div></div>`).join('');
    document.querySelectorAll('.remove-player').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const id = parseInt(btn.dataset.id); showConfirm(`Supprimer le joueur ?`, (confirmed) => { if (confirmed) { players = players.filter(p => p.id !== id); renderPlayers(); Storage.savePlayers(players); } }); }); });
    document.querySelectorAll('.remove-item').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const pid = parseInt(btn.dataset.playerId), iidx = parseInt(btn.dataset.itemIdx); const pl = players.find(p => p.id === pid); if (pl && pl.items[iidx]) { showConfirm(`Retirer "${pl.items[iidx].name}" de ${pl.name} ?`, (confirmed) => { if (confirmed) { pl.items.splice(iidx, 1); renderPlayers(); Storage.savePlayers(players); } }); } }); });
    setupDropZones(); setupPlayerItemDrag(); Storage.savePlayers(players);
  }
  function addItemToPlayer(pid, item) { const p = players.find(p => p.id === pid); if (p) { p.items.push({ ...item }); renderPlayers(); Storage.savePlayers(players); } }
  function setupDropZones() {
    document.querySelectorAll('.player-items').forEach(zone => {
      zone.removeEventListener('dragover', zone._dragOverHandler); zone.removeEventListener('dragleave', zone._dragLeaveHandler); zone.removeEventListener('drop', zone._dropHandler);
      zone._dragOverHandler = e => { e.preventDefault(); zone.closest('.player-card')?.classList.add('drag-over'); };
      zone._dragLeaveHandler = () => { zone.closest('.player-card')?.classList.remove('drag-over'); };
      zone._dropHandler = e => { e.preventDefault(); zone.closest('.player-card')?.classList.remove('drag-over'); const pid = parseInt(zone.dataset.playerId); if (draggedItem && pid) { addItemToPlayer(pid, draggedItem); draggedItem = null; } };
      zone.addEventListener('dragover', zone._dragOverHandler); zone.addEventListener('dragleave', zone._dragLeaveHandler); zone.addEventListener('drop', zone._dropHandler);
    });
  }
  function setupPlayerItemDrag() {
    document.querySelectorAll('.player-item').forEach(item => {
      item.setAttribute('draggable', 'true');
      item.removeEventListener('dragstart', item._dragStartHandler); item.removeEventListener('dragend', item._dragEndHandler);
      item._dragStartHandler = e => { const card = item.closest('.player-card'); const pid = parseInt(card?.dataset.playerId); const iidx = parseInt(item.dataset.itemIdx); const p = players.find(p => p.id === pid); if (p && p.items[iidx]) { draggedItem = p.items[iidx]; e.dataTransfer.setData('text/plain', JSON.stringify(draggedItem)); } };
      item._dragEndHandler = () => { draggedItem = null; };
      item.addEventListener('dragstart', item._dragStartHandler); item.addEventListener('dragend', item._dragEndHandler);
    });
  }

  // ==================== HISTORIQUE (sans heure) ====================
  function addToHistory(item) { history.unshift({ ...item, id: item.id || Date.now(), date: new Date().toLocaleDateString('fr-FR') }); if (history.length > 50) history.pop(); renderHistory(); Storage.saveHistory(history); }
  function renderHistory() {
    if (!historyListEl) return;
    if (history.length === 0) { historyListEl.innerHTML = '<div style="text-align: center; color: #6a6a7a; padding: 32px;">Aucun tirage</div>'; return; }
    historyListEl.innerHTML = history.map((item, idx) => `<div class="history-item" draggable="true" data-item-idx="${idx}" data-item-name="${escapeHtml(item.name)}" data-item-img="${item.img || ''}" data-item-cat="${item.category || ''}"><img src="${item.img || ''}" onerror="this.style.display='none'"><div class="history-info"><div class="history-name">${escapeHtml(item.name)}</div><div class="history-category">${escapeHtml(item.category?.toUpperCase() || 'GÉNÉRAL')}</div></div></div>`).join('');
    document.querySelectorAll('.history-item').forEach(el => {
      el.setAttribute('draggable', 'true');
      el.removeEventListener('dragstart', el._dragStartHandler); el.removeEventListener('dragend', el._dragEndHandler);
      el._dragStartHandler = e => { const name = el.dataset.itemName, img = el.dataset.itemImg, cat = el.dataset.itemCat; draggedItem = { name, img, category: cat }; e.dataTransfer.setData('text/plain', JSON.stringify(draggedItem)); el.classList.add('dragging'); };
      el._dragEndHandler = () => { el.classList.remove('dragging'); draggedItem = null; };
      el.addEventListener('dragstart', el._dragStartHandler); el.addEventListener('dragend', el._dragEndHandler);
    });
  }
  function clearHistory() { showConfirm('Effacer tout l\'historique des tirages ?', (confirmed) => { if (confirmed) { history = []; renderHistory(); Storage.saveHistory(history); } }); }

  // ==================== LISTE DES ÉLÉMENTS ====================
  function renderItemsList() {
    if (!itemsListEl || !currentItems.length) { if (itemsListEl) itemsListEl.innerHTML = '<div style="text-align: center; color: #6a6a7a; padding: 32px;">Aucun élément</div>'; return; }
    const filtered = currentItems.filter(i => i.name.toLowerCase().includes(searchQuery.toLowerCase()));
    if (filtered.length === 0) { itemsListEl.innerHTML = '<div style="text-align: center; color: #6a6a7a; padding: 32px;">Aucun résultat</div>'; return; }
    itemsListEl.innerHTML = filtered.map(i => `<div class="item-check" data-item-id="${i.id}"><input type="checkbox" id="cb_${i.id}" ${i.checked ? 'checked' : ''}><label for="cb_${i.id}" class="item-name">${escapeHtml(i.name)}</label></div>`).join('');
    filtered.forEach(i => { const cb = document.getElementById(`cb_${i.id}`); if (cb) cb.addEventListener('change', () => { i.checked = cb.checked; updateCount(); renderReel(); }); });
    updateCount();
  }
  function checkAll() { currentItems.forEach(i => i.checked = true); renderItemsList(); renderReel(); }
  function uncheckAll() { currentItems.forEach(i => i.checked = false); renderItemsList(); renderReel(); }

  // ==================== ROULETTE (version finale avec repère et correction gagnant) ====================
  const CARD_H = 135, REPETITIONS = 20;
  function generateBalancedShuffledStrip(selected) {
    if (selected.length === 0) return [];
    const shuffled = [...selected];
    for (let i = shuffled.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
    let flat = [];
    for (let i=0; i<shuffled.length; i++) for (let r=0; r<REPETITIONS; r++) flat.push({ ...shuffled[i] });
    for (let i=flat.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [flat[i], flat[j]] = [flat[j], flat[i]]; }
    for (let i=0; i<flat.length-1; i++) {
      if (flat[i].name === flat[i+1].name) {
        let swap = i+2;
        while (swap<flat.length && flat[swap].name === flat[i].name) swap++;
        if (swap<flat.length) [flat[i+1], flat[swap]] = [flat[swap], flat[i+1]];
      }
    }
    return flat;
  }
  function buildStripFromItems(items) {
    reelStrip.innerHTML = '';
    for (let i=0; i<items.length; i++) {
      const card = document.createElement('div');
      card.className = 'reel-item';
      card.style.height = CARD_H + 'px';
      card.innerHTML = `<img src="${items[i].img || ''}" onerror="this.style.display='none'"><div class="reel-name">${escapeHtml(items[i].name)}</div>`;
      reelStrip.appendChild(card);
    }
  }
  function getRandomSafeStartPosition(totalHeight) {
    const viewHeight = reelViewport.offsetHeight;
    const maxY = 0, minY = -(totalHeight - viewHeight);
    const safeRange = (maxY - minY) * 0.7, offset = (maxY - minY - safeRange)/2;
    return minY + offset + Math.random() * safeRange;
  }
  // Correction : utiliser Math.round pour que la carte la plus proche du centre soit choisie
  function getWinnerIndexFromPosition() {
    const viewHeight = reelViewport.offsetHeight, centerY = viewHeight/2;
    const absoluteCenter = -currentY + centerY;
    let idx = Math.round(absoluteCenter / CARD_H);
    const total = reelStrip.children.length;
    if (idx < 0) idx = 0;
    if (idx >= total) idx = total-1;
    return idx;
  }
  function updateNearCenterHighlight() {
    const viewHeight = reelViewport.offsetHeight, centerY = viewHeight/2;
    const cards = reelStrip.children;
    for (let i=0; i<cards.length; i++) {
      const cardTop = currentY + i*CARD_H, cardCenter = cardTop + CARD_H/2;
      if (Math.abs(cardCenter - centerY) < CARD_H*0.7) cards[i].classList.add('near-center');
      else cards[i].classList.remove('near-center');
    }
  }
  function revealWinnerWithDelay(winnerItem) {
    if (revealTimeout) clearTimeout(revealTimeout);
    revealTimeout = setTimeout(() => {
      const all = reelStrip.children;
      for (let i=0; i<all.length; i++) all[i].classList.remove('winner-glow','near-center');
      const idx = getWinnerIndexFromPosition();
      if (all[idx]) all[idx].classList.add('winner-glow');
      if (weaponLabel) weaponLabel.innerHTML = winnerItem.name;
      if (resultImg) resultImg.src = winnerItem.img || '';
      if (resultName) resultName.textContent = winnerItem.name;
      if (resultDisplay) resultDisplay.classList.add('active');
      addToHistory(winnerItem);
      setTimeout(() => { if (resultDisplay) resultDisplay.classList.remove('active'); }, 3000);
      revealTimeout = null;
    }, 700);
  }
  function startSpin() {
    if (spinning) return;
    if (stopTimeout) clearTimeout(stopTimeout);
    if (revealTimeout) clearTimeout(revealTimeout);
    const selected = getSelectedItems();
    if (selected.length === 0) return;
    const freshStrip = generateBalancedShuffledStrip(selected);
    if (freshStrip.length === 0) return;
    buildStripFromItems(freshStrip);
    const totalHeight = freshStrip.length * CARD_H;
    currentY = getRandomSafeStartPosition(totalHeight);
    reelStrip.style.transform = `translate3d(0, ${currentY}px, 0)`;
    const direction = Math.random() > 0.5 ? -1 : 1;
    const baseSpeed = 1200 + Math.random() * 1800;
    velocity = direction * baseSpeed;
    deceleration = 50 + Math.random() * 80;
    lastTimestamp = performance.now();
    spinning = true;
    spinBtn.disabled = true;
    spinBtn.innerHTML = 'SPINNING...';
    weaponLabel.innerHTML = '🌀 SPIN EN COURS... 🌀';
    if (resultDisplay) resultDisplay.classList.remove('active');
    const allCards = reelStrip.children;
    for (let i=0; i<allCards.length; i++) allCards[i].classList.remove('winner-glow','near-center');
    function physicsStep(now) {
      const dt = Math.min(0.033, (now - lastTimestamp)/1000);
      if (dt <= 0) { lastTimestamp = now; animFrame = requestAnimationFrame(physicsStep); return; }
      let velAbs = Math.abs(velocity);
      velAbs -= deceleration * dt;
      if (velAbs < 0) velAbs = 0;
      velocity = (velocity > 0 ? velAbs : -velAbs);
      const displacement = velocity * dt;
      currentY += displacement;
      reelStrip.style.transform = `translate3d(0, ${currentY}px, 0)`;
      updateNearCenterHighlight();
      lastTimestamp = now;
      if (Math.abs(velocity) < 5 && Math.abs(displacement) < 0.5) {
        cancelAnimationFrame(animFrame);
        animFrame = null;
        spinning = false;
        spinBtn.disabled = false;
        spinBtn.innerHTML = 'SPIN';
        reelStrip.style.transform = `translate3d(0, ${currentY}px, 0)`;
        const winnerIdx = getWinnerIndexFromPosition();
        let winnerItem = selected[0];
        const winnerCard = reelStrip.children[winnerIdx];
        if (winnerCard) {
          const nameDiv = winnerCard.querySelector('.reel-name');
          if (nameDiv) {
            const winnerName = nameDiv.innerText.trim(); // important : trim()
            const found = selected.find(i => i.name === winnerName);
            if (found) winnerItem = found;
          }
        }
        if (stopTimeout) clearTimeout(stopTimeout);
        stopTimeout = setTimeout(() => { revealWinnerWithDelay(winnerItem); stopTimeout = null; }, 400);
        return;
      }
      animFrame = requestAnimationFrame(physicsStep);
    }
    animFrame = requestAnimationFrame(physicsStep);
  }
  function renderReel() {
    if (spinning) return;
    const selected = getSelectedItems();
    if (selected.length === 0) { reelStrip.innerHTML = '<div class="reel-item"><div>Aucun élément sélectionné</div></div>'; spinBtn.disabled = true; return; }
    let preview = [];
    for (let i=0; i<3; i++) preview.push(...selected);
    reelStrip.innerHTML = '';
    for (let i=0; i<preview.length; i++) {
      const card = document.createElement('div');
      card.className = 'reel-item';
      card.style.height = CARD_H + 'px';
      card.innerHTML = `<img src="${preview[i].img || ''}" onerror="this.style.display='none'"><div class="reel-name">${escapeHtml(preview[i].name)}</div>`;
      reelStrip.appendChild(card);
    }
    currentY = 0;
    reelStrip.style.transform = `translate3d(0, 0px, 0)`;
    spinBtn.disabled = false;
  }

  // ==================== CATÉGORIES ====================
  function renderCategories() {
    if (!categoriesListEl || typeof DESTINY_DATA === 'undefined') return;
    const cats = DESTINY_DATA.categories;
    categoriesListEl.innerHTML = Object.keys(cats).map(k => `<div class="roulette-item" data-category="${k}"><div class="item-icon">${cats[k].logo ? `<img src="${cats[k].logo}" alt="${cats[k].title}">` : ''}</div><div class="item-info"><div class="item-title">${cats[k].title}</div><div class="item-sub">${(DESTINY_DATA.items[k] || []).length} items</div></div></div>`).join('');
    document.querySelectorAll('.roulette-item').forEach(el => { el.addEventListener('click', () => { const cat = el.dataset.category; selectCategory(cat); }); });
    if (Object.keys(cats).length && !currentCategory) selectCategory(Object.keys(cats)[0]);
  }
  function selectCategory(catKey) {
    if (spinning) return;
    currentCategory = catKey;
    const src = DESTINY_DATA.items[catKey] || [];
    currentItems = src.map(i => ({ ...i, checked: true }));
    if (resultDisplay) resultDisplay.classList.remove('active');
    document.querySelectorAll('.roulette-item').forEach(el => { if (el.dataset.category === catKey) el.classList.add('active'); else el.classList.remove('active'); });
    renderItemsList();
    renderReel();
    if (weaponLabel) { const info = DESTINY_DATA.categories[currentCategory]; weaponLabel.innerHTML = info ? info.title : currentCategory?.toUpperCase() || 'SÉLECTIONNE UNE CATÉGORIE'; }
  }

  // ==================== MODAL JOUEUR ====================
  function openPlayerModal() { if (playerModal) { playerModal.classList.add('active'); playerNameInput.focus(); } }
  function closePlayerModal() { playerModal.classList.remove('active'); playerNameInput.value = ''; }
  function addPlayer() { const name = playerNameInput?.value.trim(); if (!name) return; players.push({ id: nextPlayerId++, name, items: [] }); renderPlayers(); closePlayerModal(); }

  // ==================== INITIALISATION ====================
  function init() {
    if (typeof DESTINY_DATA === 'undefined') { console.error('data.js non chargé !'); if (weaponLabel) weaponLabel.innerHTML = 'ERREUR : data.js manquant'; return; }
    players = Storage.loadPlayers(); history = Storage.loadHistory();
    if (players.length === 0) players = [];
    if (players.length) nextPlayerId = Math.max(...players.map(p => p.id)) + 1;
    renderCategories(); renderPlayers(); renderHistory();
    spinBtn?.addEventListener('click', startSpin);
    clearHistoryBtn?.addEventListener('click', clearHistory);
    addPlayerBtn?.addEventListener('click', openPlayerModal);
    cancelModalBtn?.addEventListener('click', closePlayerModal);
    confirmModalBtn?.addEventListener('click', addPlayer);
    checkAllBtn?.addEventListener('click', checkAll);
    uncheckAllBtn?.addEventListener('click', uncheckAll);
    exportPngBtn?.addEventListener('click', exportToPNG);
    searchBar?.addEventListener('input', (e) => { searchQuery = e.target.value; renderItemsList(); });
    confirmYesBtn?.addEventListener('click', () => { if (pendingConfirmCallback) pendingConfirmCallback(true); hideConfirm(); });
    confirmNoBtn?.addEventListener('click', () => { if (pendingConfirmCallback) pendingConfirmCallback(false); hideConfirm(); });
    playerModal?.addEventListener('click', (e) => { if (e.target === playerModal) closePlayerModal(); });
    confirmDialog?.addEventListener('click', (e) => { if (e.target === confirmDialog) hideConfirm(); });
    playerNameInput?.addEventListener('keypress', (e) => { if (e.key === 'Enter') addPlayer(); });
    console.log('Application prête - ' + players.length + ' joueurs, ' + history.length + ' historiques');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
