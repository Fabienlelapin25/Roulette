<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Destiny 2 - Loadout Manager | Roulette Ultime</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0e;
      font-family: 'Segoe UI', 'Rajdhani', monospace;
      height: 100vh;
      overflow: hidden;
      color: #c8c8d8;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    /* ===== BANNIÈRE SUPÉRIEURE ===== */
    .players-banner {
      background: #0c0c10;
      border-bottom: 1px solid #2a2a35;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 90px;
    }
    .players-list {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      flex: 1;
    }
    .player-card {
      background: #14141c;
      border: 1px solid #3a3a48;
      min-width: 180px;
      padding: 8px 12px;
      position: relative;
      transition: 0.15s;
    }
    .player-card.drag-over {
      border-color: #aa88ff;
      background: #1c1c28;
      box-shadow: 0 0 10px rgba(170, 136, 255, 0.2);
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2a2a35;
    }
    .player-name {
      font-weight: bold;
      color: #aa88ff;
      font-size: 13px;
      text-transform: uppercase;
    }
    .remove-player {
      background: none;
      border: none;
      color: #6a6a7a;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
    }
    .remove-player:hover { color: #ff8888; }
    .player-items {
      min-height: 60px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .player-item {
      background: #1a1a24;
      border-left: 2px solid #aa88ff;
      padding: 4px 8px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
    }
    .player-item:active { cursor: grabbing; }
    .remove-item {
      background: none;
      border: none;
      color: #6a6a7a;
      cursor: pointer;
      font-size: 12px;
    }
    .remove-item:hover { color: #ff8888; }
    .empty-player {
      color: #6a6a7a;
      font-size: 10px;
      text-align: center;
      padding: 12px;
      font-style: italic;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .add-player-btn, .export-png-btn {
      background: #14141c;
      border: 1px solid #3a3a48;
      color: #aa88ff;
      padding: 8px 16px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      transition: 0.15s;
      white-space: nowrap;
    }
    .add-player-btn:hover, .export-png-btn:hover {
      background: #1c1c26;
      border-color: #8866cc;
    }
    .export-png-btn { background: #1a1a2a; border-color: #8866cc; }
    /* ===== CONTENU PRINCIPAL ===== */
    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    /* PANEL GAUCHE - Catégories */
    .roulettes-panel {
      width: 260px;
      background: #0f0f14;
      border-right: 1px solid #2a2a35;
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a35;
      background: #0c0c10;
    }
    .panel-header h2 {
      font-size: 12px;
      color: #aa88ff;
      letter-spacing: 2px;
    }
    .roulettes-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .roulette-item {
      background: #14141c;
      border: 1px solid #2a2a35;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.15s;
    }
    .roulette-item:hover {
      background: #1c1c26;
      border-color: #8866cc;
    }
    .roulette-item.active {
      background: #1a1a24;
      border-left: 3px solid #aa77ff;
    }
    .item-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0e;
      border: 1px solid #3a3a48;
    }
    .item-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .item-title {
      font-size: 13px;
      font-weight: 600;
      color: #d0d0e0;
    }
    .item-sub {
      font-size: 10px;
      color: #88889a;
    }
    /* PANEL CENTRAL - Roulette + Liste */
    .center-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0a0a0e;
      overflow-y: auto;
    }
    .slot-machine {
      text-align: center;
      padding: 24px 24px 16px 24px;
      border-bottom: 1px solid #2a2a35;
    }
    .weapon-label {
      font-size: 14px;
      margin-bottom: 16px;
      color: #aa88ff;
      background: #0f0f14;
      padding: 10px 20px;
      border: 1px solid #2a2a35;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-block;
    }
    .reel-viewport {
      width: 320px;
      height: 540px;
      margin: 0 auto;
      overflow: hidden;
      background: #0f0f14;
      border: 2px solid #3a3a48;
      position: relative;
    }
    .reel-viewport::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 3px;
      background: #ffcc44;
      transform: translateY(-50%);
      z-index: 5;
      pointer-events: none;
      box-shadow: 0 0 8px #ffcc44;
    }
    .reel-strip {
      display: flex;
      flex-direction: column;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
    }
    .reel-item {
      height: 135px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #14141c;
      gap: 8px;
      border-bottom: 1px solid #2a2a35;
    }
    .reel-item img {
      max-width: 100px;
      max-height: 80px;
      object-fit: contain;
    }
    .reel-item .reel-name {
      font-size: 12px;
      font-weight: bold;
      color: #d0d0e0;
      text-align: center;
      padding: 0 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .reel-item.near-center {
      filter: brightness(1.15);
      box-shadow: 0 0 8px #ffcc4488;
    }
    .reel-item.winner-glow {
      filter: brightness(1.3) drop-shadow(0 0 12px #ffcc44);
      background: linear-gradient(145deg, #3a3e60, #2a2c44);
      transition: all 0.2s ease-out;
    }
    .result-display {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(20, 20, 28, 0.92);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .result-display.active {
      opacity: 1;
      visibility: visible;
    }
    .result-display img {
      max-width: 180px;
      max-height: 180px;
      object-fit: contain;
      animation: zoomExplosion 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    .result-display .result-name {
      font-size: 16px;
      font-weight: bold;
      color: #aa88ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      padding: 0 16px;
      animation: fadeInUp 0.5s ease-out 0.1s both;
    }
    @keyframes zoomExplosion {
      0% { transform: scale(0.2) rotate(-15deg); opacity: 0; filter: blur(4px); }
      40% { transform: scale(1.1) rotate(2deg); }
      70% { transform: scale(0.98); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
    }
    @keyframes fadeInUp {
      0% { transform: translateY(30px); opacity: 0; letter-spacing: 5px; }
      100% { transform: translateY(0); opacity: 1; letter-spacing: 2px; }
    }
    .btn-spin {
      margin-top: 20px;
      background: #14141c;
      border: 2px solid #3a3a48;
      padding: 10px 32px;
      font-size: 14px;
      font-weight: bold;
      color: #aa88ff;
      cursor: pointer;
      font-family: monospace;
      letter-spacing: 4px;
      transition: 0.15s;
    }
    .btn-spin:hover {
      background: #1c1c26;
      border-color: #8866cc;
    }
    .btn-spin:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    /* Liste des éléments */
    .items-section {
      padding: 16px 24px 24px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 250px;
    }
    .items-header {
      margin-bottom: 12px;
    }
    .items-header h3 {
      color: #aa88ff;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .search-bar {
      width: 100%;
      padding: 8px 12px;
      background: #0a0a0e;
      border: 1px solid #3a3a48;
      color: #c8c8d8;
      font-family: monospace;
      font-size: 11px;
      margin-bottom: 10px;
    }
    .search-bar:focus {
      outline: none;
      border-color: #8866cc;
    }
    .list-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .list-controls button {
      background: #14141c;
      border: 1px solid #3a3a48;
      color: #c8c8d8;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 9px;
      font-family: monospace;
      transition: 0.15s;
    }
    .list-controls button:hover {
      background: #1c1c26;
      border-color: #8866cc;
    }
    .count-selected {
      color: #aa88ff;
      font-size: 10px;
      margin-left: auto;
      display: flex;
      align-items: center;
    }
    .items-list {
      flex: 1;
      overflow-y: auto;
      max-height: 200px;
      border: 1px solid #2a2a35;
      background: #0f0f14;
    }
    .item-check {
      background: #14141c;
      border-bottom: 1px solid #2a2a35;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.1s;
    }
    .item-check:hover {
      background: #1c1c26;
    }
    .item-check input {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: #aa88ff;
    }
    .item-check .item-name {
      font-size: 10px;
      font-weight: 500;
      color: #d0d0e0;
      flex: 1;
      text-transform: uppercase;
    }
    /* PANEL DROIT - Historique */
    .history-panel {
      width: 280px;
      background: #0f0f14;
      border-left: 1px solid #2a2a35;
      display: flex;
      flex-direction: column;
    }
    .history-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a35;
      background: #0c0c10;
    }
    .history-header h3 {
      color: #aa88ff;
      font-size: 12px;
      letter-spacing: 2px;
    }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .history-item {
      background: #14141c;
      border: 1px solid #2a2a35;
      padding: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: grab;
      transition: 0.1s;
    }
    .history-item:active { cursor: grabbing; }
    .history-item.dragging { opacity: 0.4; }
    .history-item img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      background: #0a0a0e;
      border: 1px solid #3a3a48;
    }
    .history-info { flex: 1; }
    .history-name {
      font-size: 10px;
      font-weight: 600;
      color: #d0d0e0;
      text-transform: uppercase;
    }
    .history-category {
      font-size: 8px;
      color: #aa88ff;
      text-transform: uppercase;
    }
    .clear-history-btn {
      background: #14141c;
      border: 1px solid #4a3a5a;
      color: #aa88aa;
      padding: 8px;
      cursor: pointer;
      font-size: 10px;
      width: calc(100% - 24px);
      margin: 0 12px 12px 12px;
      text-transform: uppercase;
    }
    .clear-history-btn:hover {
      background: #1c1c26;
      border-color: #ff8888;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0f0f14; }
    ::-webkit-scrollbar-thumb { background: #3a3a48; }
    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #14141c;
      border: 1px solid #8866cc;
      padding: 24px;
      min-width: 300px;
    }
    .modal-content h3 {
      color: #aa88ff;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      background: #0a0a0e;
      border: 1px solid #3a3a48;
      color: #c8c8d8;
      margin-bottom: 16px;
      font-family: monospace;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .modal-buttons button {
      background: #1c1c26;
      border: 1px solid #3a3a48;
      color: #c8c8d8;
      padding: 6px 16px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .modal-buttons button.confirm {
      border-color: #aa88ff;
      color: #aa88ff;
    }
    /* Responsive */
    @media (max-width: 1000px) {
      .history-panel { width: 240px; }
      .reel-viewport { width: 280px; height: 480px; }
      .reel-item { height: 120px; }
    }
    @media (max-width: 900px) {
      .roulettes-panel { width: 220px; }
      .history-panel { width: 220px; }
    }
    @media (max-width: 768px) {
      .main-content { flex-direction: column; }
      .roulettes-panel { width: 100%; max-height: 120px; flex-direction: row; overflow-x: auto; }
      .roulettes-list { flex-direction: row; overflow-x: auto; }
      .roulette-item { min-width: 100px; }
      .history-panel { width: 100%; max-height: 200px; }
      .center-panel { order: 1; }
      .roulettes-panel { order: 2; }
      .history-panel { order: 3; }
      .items-list { max-height: 150px; }
      .reel-viewport { width: 260px; height: 420px; }
      .reel-item { height: 105px; }
    }

    /* ===== SPIN CASE OPENING V2 ===== */
    .reel-viewport::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(10,10,14,0.92) 0%,
          rgba(10,10,14,0.35) 18%,
          rgba(10,10,14,0.00) 38%,
          rgba(10,10,14,0.00) 62%,
          rgba(10,10,14,0.35) 82%,
          rgba(10,10,14,0.92) 100%
        );
    }

    .reel-viewport.is-spinning::before {
      animation: centerMarkerPulse 0.7s ease-in-out infinite alternate;
    }

    .reel-viewport.is-settling::before {
      animation: centerMarkerLock 0.18s ease-out 2 alternate;
    }

    @keyframes centerMarkerPulse {
      from {
        box-shadow: 0 0 6px #ffcc44;
        opacity: 0.78;
      }
      to {
        box-shadow: 0 0 18px #ffcc44;
        opacity: 1;
      }
    }

    @keyframes centerMarkerLock {
      from {
        box-shadow: 0 0 8px #ffcc44;
      }
      to {
        box-shadow: 0 0 26px #ffcc44;
      }
    }

  
    /* ================================================================
       GOLEM // CONTROL PANEL DESIGN 02
       Même langage visuel que le Control Panel.
       Aucun changement du moteur de roulette.
       ================================================================ */

    :root{
      --bg:#060607;
      --panel:#0e0e12;
      --panel-dark:#0b0b0e;
      --panel-soft:#101013;
      --panel-hover:#151518;
      --line:#292933;
      --line-soft:#25252e;
      --line-strong:#3a3a40;
      --text:#f4f4f7;
      --muted:#858590;
      --muted2:#707077;
      --green:#62df8a;
      --red:#ef7676;
    }

    *{
      box-sizing:border-box;
      border-radius:0 !important;
    }

    body{
      margin:0;
      background:var(--bg) !important;
      background-image:none !important;
      color:var(--text);
      font-family:Arial,sans-serif;
    }

    button,
    input{
      font:inherit;
    }

    .app{
      background:var(--bg);
    }

    /* ---------- BANDEAU JOUEURS ---------- */

    .players-banner{
      min-height:92px;
      padding:15px 18px;
      gap:12px;
      background:#09090b;
      border-bottom:1px solid var(--line);
      box-shadow:none;
    }

    .players-list{
      gap:9px;
    }

    .player-card{
      min-width:185px;
      padding:10px;
      background:var(--panel-dark);
      border:1px solid var(--line-soft);
      box-shadow:none;
      transition:border-color .14s ease,background .14s ease;
    }

    .player-card:hover{
      border-color:#34343e;
    }

    .player-card.drag-over{
      border-color:#e8e8ec;
      background:#111114;
      box-shadow:inset 3px 0 0 #fff;
    }

    .player-header{
      margin-bottom:8px;
      padding-bottom:7px;
      border-bottom:1px solid #222228;
    }

    .player-name{
      color:var(--text);
      font-family:Georgia,serif;
      font-size:12px;
      font-weight:700;
      letter-spacing:.5px;
      text-transform:uppercase;
    }

    .remove-player,
    .remove-item{
      color:#6f6f78;
      transition:color .12s ease;
    }

    .remove-player:hover,
    .remove-item:hover{
      color:var(--red);
    }

    .player-items{
      min-height:57px;
      gap:4px;
    }

    .player-item{
      padding:5px 7px;
      background:#101013;
      border-left:3px solid #57575f;
      color:#d5d5da;
      font-size:10px;
    }

    .empty-player{
      color:#6d6d74;
      font-size:10px;
    }

    .button-group{
      gap:7px;
    }

    .add-player-btn,
    .export-png-btn{
      min-width:154px;
      padding:9px 12px;
      font-family:Arial,sans-serif;
      font-size:10px;
      font-weight:700;
      letter-spacing:.5px;
      text-transform:uppercase;
      cursor:pointer;
      transition:background .14s ease,border-color .14s ease,color .14s ease;
    }

    .add-player-btn{
      background:transparent;
      color:#ddd;
      border:1px solid #444;
    }

    .add-player-btn:hover{
      background:#111114;
      border-color:#66666d;
      color:#fff;
    }

    .export-png-btn{
      background:#fff;
      color:#080809;
      border:1px solid #fff;
    }

    .export-png-btn:hover{
      background:#ededf0;
      border-color:#ededf0;
      color:#080809;
    }

    /* ---------- STRUCTURE PRINCIPALE ---------- */

    .main-content{
      background:var(--bg);
    }

    .roulettes-panel{
      width:245px;
      background:#09090b;
      border-right:1px solid var(--line);
    }

    .history-panel{
      width:280px;
      background:#09090b;
      border-left:1px solid var(--line);
    }

    .center-panel{
      background:var(--bg);
    }

    .panel-header,
    .history-header{
      padding:16px 15px;
      background:#09090b;
      border-bottom:1px solid var(--line);
    }

    .panel-header h2,
    .history-header h3{
      margin:0;
      color:#f1f1f4;
      font-family:Georgia,serif;
      font-size:14px;
      font-weight:700;
      letter-spacing:.6px;
    }

    /* ---------- CATÉGORIES ---------- */

    .roulettes-list{
      padding:11px;
      gap:5px;
    }

    .roulette-item{
      min-height:61px;
      padding:10px;
      gap:10px;
      background:transparent;
      border:1px solid transparent;
      color:#aaa;
      transition:background .14s ease,border-color .14s ease,color .14s ease;
    }

    .roulette-item:hover{
      background:#111114;
      border-color:#3a3a40;
      color:#fff;
    }

    .roulette-item.active{
      background:#151518;
      border:1px solid #e8e8ec;
      border-left:1px solid #e8e8ec;
      box-shadow:inset 3px 0 0 #fff;
      color:#fff;
    }

    .item-icon{
      width:38px;
      height:38px;
      background:#08080a;
      border:1px solid #363640;
    }

    .item-title{
      color:#e2e2e5;
      font-size:12px;
      font-weight:700;
    }

    .item-sub{
      margin-top:2px;
      color:#707077;
      font-size:9px;
      text-transform:uppercase;
      letter-spacing:.4px;
    }

    /* ---------- ZONE CENTRALE / SPIN ---------- */

    .slot-machine{
      padding:22px 24px 17px;
      background:var(--bg);
      border-bottom:1px solid var(--line-soft);
    }

    .weapon-label{
      min-width:320px;
      margin-bottom:14px;
      padding:10px 15px;
      background:var(--panel-dark);
      border:1px solid var(--line-soft);
      color:#dedee2;
      font-family:Georgia,serif;
      font-size:14px;
      font-weight:700;
      letter-spacing:.4px;
      text-transform:uppercase;
    }

    .reel-viewport{
      width:320px;
      height:540px;
      margin:0 auto;
      background:#08080a;
      border:1px solid #363640;
      box-shadow:none;
    }

    .reel-viewport::before{
      height:2px;
      background:#f0f0f2;
      box-shadow:0 0 0 1px rgba(255,255,255,.10);
    }

    .reel-viewport::after{
      background:
        linear-gradient(
          to bottom,
          rgba(6,6,7,.96) 0%,
          rgba(6,6,7,.58) 15%,
          rgba(6,6,7,0) 37%,
          rgba(6,6,7,0) 63%,
          rgba(6,6,7,.58) 85%,
          rgba(6,6,7,.96) 100%
        );
    }

    .reel-item{
      background:#0d0d11;
      border-bottom:1px solid #222228;
      gap:8px;
    }

    .reel-item:nth-child(even){
      background:#0b0b0e;
    }

    .reel-item img{
      max-width:100px;
      max-height:80px;
      filter:none;
    }

    .reel-item .reel-name{
      color:#dedee2;
      font-family:Arial,sans-serif;
      font-size:11px;
      font-weight:700;
      letter-spacing:.6px;
    }

    .reel-item.near-center{
      filter:brightness(1.08);
      box-shadow:inset 0 0 0 1px #4a4a50;
    }

    .reel-item.winner-glow{
      background:#121b14;
      filter:none;
      box-shadow:
        inset 3px 0 0 var(--green),
        inset -3px 0 0 var(--green);
      transition:background .2s ease,box-shadow .2s ease;
    }

    .result-display{
      background:rgba(6,6,7,.94);
      backdrop-filter:blur(3px);
    }

    .result-display img{
      max-width:180px;
      max-height:180px;
    }

    .result-display .result-name{
      color:#f2f2f4;
      font-family:Georgia,serif;
      font-size:17px;
      font-weight:700;
      letter-spacing:1px;
    }

    .btn-spin{
      min-width:320px;
      margin-top:17px;
      padding:10px 14px;
      background:#fff;
      color:#080809;
      border:1px solid #fff;
      font-family:Arial,sans-serif;
      font-size:11px;
      font-weight:700;
      letter-spacing:.7px;
      text-transform:uppercase;
      transition:background .14s ease,border-color .14s ease,opacity .14s ease;
    }

    .btn-spin:hover{
      background:#ededf0;
      border-color:#ededf0;
    }

    .btn-spin:disabled{
      background:#151518;
      color:#6d6d74;
      border-color:#303039;
      opacity:1;
    }

    /* La ligne reste blanche comme le Control Panel.
       Le vert n'apparaît que lors du verrouillage du résultat. */
    .reel-viewport.is-spinning::before{
      animation:cpMarkerPulse .7s ease-in-out infinite alternate;
    }

    .reel-viewport.is-settling::before{
      background:var(--green);
      animation:cpMarkerLock .18s ease-out 2 alternate;
    }

    @keyframes cpMarkerPulse{
      from{opacity:.55}
      to{opacity:1}
    }

    @keyframes cpMarkerLock{
      from{box-shadow:0 0 0 1px rgba(98,223,138,.08)}
      to{box-shadow:0 0 9px rgba(98,223,138,.38)}
    }

    /* ---------- LISTE DES ÉLÉMENTS ---------- */

    .items-section{
      padding:16px 24px 24px;
      background:var(--bg);
    }

    .items-header{
      margin-bottom:11px;
    }

    .items-header h3{
      margin:0 0 10px;
      color:#f1f1f4;
      font-family:Georgia,serif;
      font-size:14px;
      font-weight:700;
      letter-spacing:.4px;
    }

    .search-bar{
      margin-bottom:9px;
      padding:9px 10px;
      background:#08080a;
      color:#fff;
      border:1px solid #363640;
      font-family:Arial,sans-serif;
      font-size:11px;
      outline:none;
    }

    .search-bar:focus{
      border-color:#8a8a92;
      box-shadow:none;
    }

    .search-bar::placeholder{
      color:#6f6f77;
    }

    .list-controls{
      gap:7px;
      margin-bottom:10px;
    }

    .list-controls button{
      padding:7px 9px;
      background:transparent;
      color:#c7c7cd;
      border:1px solid #444;
      font-family:Arial,sans-serif;
      font-size:9px;
      font-weight:700;
      letter-spacing:.3px;
      text-transform:uppercase;
    }

    .list-controls button:hover{
      background:#111114;
      border-color:#66666d;
      color:#fff;
    }

    .count-selected{
      color:#858590;
      font-size:10px;
    }

    .items-list{
      max-height:200px;
      background:var(--panel-dark);
      border:1px solid var(--line-soft);
    }

    .item-check{
      padding:7px 9px;
      background:#0d0d11;
      border-bottom:1px solid #222228;
    }

    .item-check:hover{
      background:#111116;
    }

    .item-check input{
      accent-color:var(--green);
    }

    .item-check .item-name{
      color:#d5d5da;
      font-size:10px;
      font-weight:600;
    }

    /* ---------- HISTORIQUE ---------- */

    .history-list{
      padding:11px;
    }

    .history-item{
      margin-bottom:6px;
      padding:8px;
      background:var(--panel-dark);
      border:1px solid var(--line-soft);
      gap:9px;
    }

    .history-item:hover{
      background:#111114;
      border-color:#34343e;
    }

    .history-item img{
      width:36px;
      height:36px;
      background:#08080a;
      border:1px solid #363640;
    }

    .history-name{
      color:#dedee2;
      font-size:10px;
      font-weight:700;
    }

    .history-category{
      margin-top:2px;
      color:#77777f;
      font-size:8px;
      letter-spacing:.4px;
    }

    .clear-history-btn{
      width:calc(100% - 22px);
      margin:0 11px 11px;
      padding:8px 9px;
      background:transparent;
      color:#ff8787;
      border:1px solid #773636;
      font-family:Arial,sans-serif;
      font-size:9px;
      font-weight:700;
      letter-spacing:.4px;
      text-transform:uppercase;
    }

    .clear-history-btn:hover{
      background:#1a0c0c;
      border-color:#9a4747;
      color:#ff9a9a;
    }

    /* ---------- MODALES ---------- */

    .modal{
      background:#000c;
      backdrop-filter:none;
    }

    .modal-content{
      min-width:320px;
      padding:18px;
      background:#101014;
      border:1px solid #555;
      box-shadow:none;
      color:var(--text);
    }

    .modal-content h3{
      margin:0 0 14px;
      color:#f1f1f4;
      font-family:Georgia,serif;
      font-size:15px;
      letter-spacing:.4px;
      text-transform:none;
    }

    .modal-content input{
      padding:9px;
      background:#08080a;
      color:#fff;
      border:1px solid #363640;
      font-family:Arial,sans-serif;
    }

    .modal-content input:focus{
      outline:none;
      border-color:#8a8a92;
    }

    .modal-buttons{
      gap:8px;
    }

    .modal-buttons button{
      padding:9px 12px;
      background:transparent;
      color:#ddd;
      border:1px solid #444;
      font-family:Arial,sans-serif;
      font-size:10px;
      font-weight:700;
    }

    .modal-buttons button:hover{
      background:#111114;
      border-color:#66666d;
      color:#fff;
    }

    .modal-buttons button.confirm{
      background:#fff;
      color:#080809;
      border-color:#fff;
    }

    .modal-buttons button.confirm:hover{
      background:#ededf0;
      border-color:#ededf0;
      color:#080809;
    }

    /* ---------- SCROLLBAR ---------- */

    ::-webkit-scrollbar{
      width:7px;
      height:7px;
    }

    ::-webkit-scrollbar-track{
      background:#0b0b0e;
    }

    ::-webkit-scrollbar-thumb{
      background:#373741;
    }

    ::-webkit-scrollbar-thumb:hover{
      background:#4a4a54;
    }

    /* ---------- RESPONSIVE ---------- */

    @media(max-width:1000px){
      .history-panel{width:240px}
      .reel-viewport{width:280px;height:480px}
      .weapon-label,.btn-spin{min-width:280px}
      .reel-item{height:120px}
    }

    @media(max-width:900px){
      .roulettes-panel{width:220px}
      .history-panel{width:220px}
    }

    @media(max-width:768px){
      .main-content{flex-direction:column}
      .roulettes-panel{
        width:100%;
        max-height:120px;
        flex-direction:row;
        overflow-x:auto;
        border-right:0;
        border-bottom:1px solid var(--line);
      }
      .roulettes-list{flex-direction:row;overflow-x:auto}
      .roulette-item{min-width:120px}
      .history-panel{
        width:100%;
        max-height:210px;
        border-left:0;
        border-top:1px solid var(--line);
      }
      .center-panel{order:1}
      .roulettes-panel{order:2}
      .history-panel{order:3}
      .items-list{max-height:150px}
      .reel-viewport{width:260px;height:420px}
      .weapon-label,.btn-spin{min-width:260px}
      .reel-item{height:105px}
    }

  </style>
</head>
<body>
<div class="app">
  <div class="players-banner">
    <div class="players-list" id="playersList"></div>
    <div class="button-group">
      <button class="add-player-btn" id="addPlayerBtn">+ AJOUTER JOUEUR</button>
      <button class="export-png-btn" id="exportPngBtn">📸 EXPORTER PNG</button>
    </div>
  </div>
  <div class="main-content">
    <div class="roulettes-panel">
      <div class="panel-header"><h2>CATÉGORIES</h2></div>
      <div class="roulettes-list" id="categoriesList"></div>
    </div>
    <div class="center-panel">
      <div class="slot-machine">
        <div class="weapon-label" id="weaponLabel">SÉLECTIONNE UNE CATÉGORIE</div>
        <div class="reel-viewport" id="reelViewport">
          <div class="reel-strip" id="reelStrip"></div>
          <div class="result-display" id="resultDisplay">
            <img id="resultImg" src="" alt="">
            <div class="result-name" id="resultName"></div>
          </div>
        </div>
        <button class="btn-spin" id="spinBtn" disabled>LANCER LE TIRAGE</button>
      </div>
      <div class="items-section">
        <div class="items-header">
          <h3>LISTE DES ÉLÉMENTS</h3>
          <input type="text" id="searchBar" class="search-bar" placeholder="RECHERCHER...">
          <div class="list-controls">
            <button id="checkAllBtn">TOUT COCHER</button>
            <button id="uncheckAllBtn">TOUT DÉCOCHER</button>
            <span class="count-selected" id="countSelected">0 sélectionné(s)</span>
          </div>
        </div>
        <div class="items-list" id="itemsList"></div>
      </div>
    </div>
    <div class="history-panel">
      <div class="history-header"><h3>HISTORIQUE (DRAG & DROP)</h3></div>
      <div class="history-list" id="historyList"></div>
      <button class="clear-history-btn" id="clearHistoryBtn">EFFACER L'HISTORIQUE</button>
    </div>
  </div>
</div>
<div class="modal" id="playerModal">
  <div class="modal-content">
    <h3>AJOUTER UN JOUEUR</h3>
    <input type="text" id="playerNameInput" placeholder="Pseudo du gardien" autocomplete="off">
    <div class="modal-buttons">
      <button id="cancelModal">ANNULER</button>
      <button id="confirmModal" class="confirm">AJOUTER</button>
    </div>
  </div>
</div>
<div class="modal" id="confirmModalDialog">
  <div class="modal-content" style="max-width: 300px;">
    <h3>CONFIRMER</h3>
    <p id="confirmMessage">Voulez-vous continuer ?</p>
    <div class="modal-buttons">
      <button id="confirmNo">NON</button>
      <button id="confirmYes" class="confirm">OUI</button>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script>
  // ==================== STORAGE ====================
  const STORAGE_KEYS = { PLAYERS: 'destiny_players', HISTORY: 'destiny_history' };
  const Storage = {
    savePlayers(p) { try { localStorage.setItem(STORAGE_KEYS.PLAYERS, JSON.stringify(p)); return true; } catch(e) { return false; } },
    loadPlayers() { try { const d = localStorage.getItem(STORAGE_KEYS.PLAYERS); return d ? JSON.parse(d) : []; } catch(e) { return []; } },
    saveHistory(h) { try { localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(h.slice(0, 50))); return true; } catch(e) { return false; } },
    loadHistory() { try { const d = localStorage.getItem(STORAGE_KEYS.HISTORY); return d ? JSON.parse(d) : []; } catch(e) { return []; } }
  };

  // ==================== ÉTAT GLOBAL ====================
  let players = [], history = [], currentCategory = null, currentItems = [], nextPlayerId = 1, draggedItem = null, pendingConfirmCallback = null, searchQuery = "";
  let spinning = false, animFrame = null, stopTimeout = null, revealTimeout = null, currentY = 0;
  let currentStripItems = [];
  let currentWinnerIndex = -1;

  const playersListEl = document.getElementById('playersList'), categoriesListEl = document.getElementById('categoriesList'), itemsListEl = document.getElementById('itemsList');
  const historyListEl = document.getElementById('historyList'), weaponLabel = document.getElementById('weaponLabel'), reelStrip = document.getElementById('reelStrip');
  const reelViewport = document.getElementById('reelViewport'), resultDisplay = document.getElementById('resultDisplay'), resultImg = document.getElementById('resultImg');
  const resultName = document.getElementById('resultName'), spinBtn = document.getElementById('spinBtn'), searchBar = document.getElementById('searchBar');
  const checkAllBtn = document.getElementById('checkAllBtn'), uncheckAllBtn = document.getElementById('uncheckAllBtn'), countSelectedEl = document.getElementById('countSelected');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn'), addPlayerBtn = document.getElementById('addPlayerBtn'), exportPngBtn = document.getElementById('exportPngBtn');
  const playerModal = document.getElementById('playerModal'), confirmDialog = document.getElementById('confirmModalDialog'), playerNameInput = document.getElementById('playerNameInput');
  const cancelModalBtn = document.getElementById('cancelModal'), confirmModalBtn = document.getElementById('confirmModal'), confirmYesBtn = document.getElementById('confirmYes');
  const confirmNoBtn = document.getElementById('confirmNo'), confirmMessage = document.getElementById('confirmMessage');

  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
  function showConfirm(msg, cb) { confirmMessage.textContent = msg; confirmDialog.classList.add('active'); pendingConfirmCallback = cb; }
  function hideConfirm() { confirmDialog.classList.remove('active'); pendingConfirmCallback = null; }
  function updateCount() { const selected = currentItems.filter(i => i.checked); countSelectedEl.textContent = selected.length + ' sélectionné(s)'; spinBtn.disabled = selected.length === 0; }
  function getSelectedItems() { return currentItems.filter(i => i.checked); }

  // ==================== EXPORT PNG (capture du bandeau) ====================
  async function exportToPNG() {
    if (!players.length) { showConfirm('Aucun joueur à exporter !', () => {}); return; }
    const banner = document.querySelector('.players-banner');
    if (!banner) return;
    try {
      const canvas = await html2canvas(banner, { scale: 2, backgroundColor: '#0a0a0e', logging: false, useCORS: true });
      const link = document.createElement('a');
      link.download = `destiny_loadout_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.png`;
      link.href = canvas.toDataURL();
      link.click();
    } catch(err) { console.error(err); showConfirm('Erreur lors de l\'export PNG', () => {}); }
  }

  // ==================== GESTION DES JOUEURS ====================
  function renderPlayers() {
    if (!playersListEl) return;
    if (players.length === 0) { playersListEl.innerHTML = '<div style="color: #6a6a7a; font-size: 12px; padding: 8px;">Aucun joueur - cliquez sur "Ajouter joueur"</div>'; return; }
    playersListEl.innerHTML = players.map(p => `<div class="player-card" data-player-id="${p.id}"><div class="player-header"><span class="player-name">${escapeHtml(p.name)}</span><button class="remove-player" data-id="${p.id}">✕</button></div><div class="player-items" data-player-id="${p.id}">${p.items.length === 0 ? '<div class="empty-player">Déposez ici ▼</div>' : p.items.map((it, idx) => `<div class="player-item" data-item-idx="${idx}" data-item-name="${escapeHtml(it.name)}" data-item-img="${it.img || ''}" data-item-cat="${it.category || ''}" draggable="true"><span>${escapeHtml(it.name)}</span><button class="remove-item" data-player-id="${p.id}" data-item-idx="${idx}">✕</button></div>`).join('')}</div></div>`).join('');
    document.querySelectorAll('.remove-player').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const id = parseInt(btn.dataset.id); showConfirm(`Supprimer le joueur ?`, (confirmed) => { if (confirmed) { players = players.filter(p => p.id !== id); renderPlayers(); Storage.savePlayers(players); } }); }); });
    document.querySelectorAll('.remove-item').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const pid = parseInt(btn.dataset.playerId), iidx = parseInt(btn.dataset.itemIdx); const pl = players.find(p => p.id === pid); if (pl && pl.items[iidx]) { showConfirm(`Retirer "${pl.items[iidx].name}" de ${pl.name} ?`, (confirmed) => { if (confirmed) { pl.items.splice(iidx, 1); renderPlayers(); Storage.savePlayers(players); } }); } }); });
    setupDropZones(); setupPlayerItemDrag(); Storage.savePlayers(players);
  }
  function addItemToPlayer(pid, item) { const p = players.find(p => p.id === pid); if (p) { p.items.push({ ...item }); renderPlayers(); Storage.savePlayers(players); } }
  function setupDropZones() {
    document.querySelectorAll('.player-items').forEach(zone => {
      zone.removeEventListener('dragover', zone._dragOverHandler); zone.removeEventListener('dragleave', zone._dragLeaveHandler); zone.removeEventListener('drop', zone._dropHandler);
      zone._dragOverHandler = e => { e.preventDefault(); zone.closest('.player-card')?.classList.add('drag-over'); };
      zone._dragLeaveHandler = () => { zone.closest('.player-card')?.classList.remove('drag-over'); };
      zone._dropHandler = e => { e.preventDefault(); zone.closest('.player-card')?.classList.remove('drag-over'); const pid = parseInt(zone.dataset.playerId); if (draggedItem && pid) { addItemToPlayer(pid, draggedItem); draggedItem = null; } };
      zone.addEventListener('dragover', zone._dragOverHandler); zone.addEventListener('dragleave', zone._dragLeaveHandler); zone.addEventListener('drop', zone._dropHandler);
    });
  }
  function setupPlayerItemDrag() {
    document.querySelectorAll('.player-item').forEach(item => {
      item.setAttribute('draggable', 'true');
      item.removeEventListener('dragstart', item._dragStartHandler); item.removeEventListener('dragend', item._dragEndHandler);
      item._dragStartHandler = e => { const card = item.closest('.player-card'); const pid = parseInt(card?.dataset.playerId); const iidx = parseInt(item.dataset.itemIdx); const p = players.find(p => p.id === pid); if (p && p.items[iidx]) { draggedItem = p.items[iidx]; e.dataTransfer.setData('text/plain', JSON.stringify(draggedItem)); } };
      item._dragEndHandler = () => { draggedItem = null; };
      item.addEventListener('dragstart', item._dragStartHandler); item.addEventListener('dragend', item._dragEndHandler);
    });
  }

  // ==================== HISTORIQUE ====================
  function addToHistory(item) { history.unshift({ ...item, id: item.id || Date.now(), date: new Date().toLocaleDateString('fr-FR') }); if (history.length > 50) history.pop(); renderHistory(); Storage.saveHistory(history); }
  function renderHistory() {
    if (!historyListEl) return;
    if (history.length === 0) { historyListEl.innerHTML = '<div style="text-align: center; color: #6a6a7a; padding: 32px;">Aucun tirage</div>'; return; }
    historyListEl.innerHTML = history.map((item, idx) => `<div class="history-item" draggable="true" data-item-idx="${idx}" data-item-name="${escapeHtml(item.name)}" data-item-img="${item.img || ''}" data-item-cat="${item.category || ''}"><img src="${item.img || ''}" onerror="this.style.display='none'"><div class="history-info"><div class="history-name">${escapeHtml(item.name)}</div><div class="history-category">${escapeHtml(item.category?.toUpperCase() || 'GÉNÉRAL')}</div></div></div>`).join('');
    document.querySelectorAll('.history-item').forEach(el => {
      el.setAttribute('draggable', 'true');
      el.removeEventListener('dragstart', el._dragStartHandler); el.removeEventListener('dragend', el._dragEndHandler);
      el._dragStartHandler = e => { const name = el.dataset.itemName, img = el.dataset.itemImg, cat = el.dataset.itemCat; draggedItem = { name, img, category: cat }; e.dataTransfer.setData('text/plain', JSON.stringify(draggedItem)); el.classList.add('dragging'); };
      el._dragEndHandler = () => { el.classList.remove('dragging'); draggedItem = null; };
      el.addEventListener('dragstart', el._dragStartHandler); el.addEventListener('dragend', el._dragEndHandler);
    });
  }
  function clearHistory() { showConfirm('Effacer tout l\'historique des tirages ?', (confirmed) => { if (confirmed) { history = []; renderHistory(); Storage.saveHistory(history); } }); }

  // ==================== LISTE DES ÉLÉMENTS ====================
  function renderItemsList() {
    if (!itemsListEl || !currentItems.length) { if (itemsListEl) itemsListEl.innerHTML = '<div style="text-align: center; color: #6a6a7a; padding: 32px;">Aucun élément</div>'; return; }
    const filtered = currentItems.filter(i => i.name.toLowerCase().includes(searchQuery.toLowerCase()));
    if (filtered.length === 0) { itemsListEl.innerHTML = '<div style="text-align: center; color: #6a6a7a; padding: 32px;">Aucun résultat</div>'; return; }
    itemsListEl.innerHTML = filtered.map(i => `<div class="item-check" data-item-id="${i.id}"><input type="checkbox" id="cb_${i.id}" ${i.checked ? 'checked' : ''}><label for="cb_${i.id}" class="item-name">${escapeHtml(i.name)}</label></div>`).join('');
    filtered.forEach(i => { const cb = document.getElementById(`cb_${i.id}`); if (cb) cb.addEventListener('change', () => { i.checked = cb.checked; updateCount(); renderReel(); }); });
    updateCount();
  }
  function checkAll() { currentItems.forEach(i => i.checked = true); renderItemsList(); renderReel(); }
  function uncheckAll() { currentItems.forEach(i => i.checked = false); renderItemsList(); renderReel(); }

  // ==================== ROULETTE — CASE OPENING V2 ====================
  const CARD_H = 135;

  // Nombre de cartes traversées avant le résultat.
  // Suffisamment long pour créer le suspense sans fabriquer un ruban de 60 000 px.
  const SPIN_MIN_TRAVEL = 48;
  const SPIN_MAX_TRAVEL = 66;
  const SPIN_TAIL_CARDS = 8;

  function randomFrom(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  // Le résultat est choisi AVANT l'animation.
  // Chaque élément sélectionné a exactement la même probabilité.
  function chooseWinner(selected) {
    return selected[Math.floor(Math.random() * selected.length)];
  }

  // Évite autant que possible 3 cartes identiques d'affilée dans le ruban.
  // Cela ne change PAS les probabilités du gagnant : ce ne sont que des cartes visuelles.
  function visualRandomItem(selected, sequence) {
    if (selected.length <= 1) return selected[0];

    let candidate = randomFrom(selected);

    if (
      sequence.length >= 2 &&
      sequence[sequence.length - 1].name === candidate.name &&
      sequence[sequence.length - 2].name === candidate.name
    ) {
      const alternatives = selected.filter(i => i.name !== candidate.name);
      if (alternatives.length) candidate = randomFrom(alternatives);
    }

    return candidate;
  }

  // Construit un ruban fini :
  // - cartes aléatoires pour l'effet case opening
  // - gagnant placé à une position connue près de la fin
  // - quelques cartes après lui pour que le ruban reste visuellement rempli.
  function buildCaseOpeningStrip(selected, winner) {
    const travel =
      SPIN_MIN_TRAVEL +
      Math.floor(Math.random() * (SPIN_MAX_TRAVEL - SPIN_MIN_TRAVEL + 1));

    const items = [];

    // Quelques cartes existent déjà avant la position de départ visible.
    for (let i = 0; i < 4; i++) {
      items.push({ ...visualRandomItem(selected, items) });
    }

    for (let i = 0; i < travel; i++) {
      items.push({ ...visualRandomItem(selected, items) });
    }

    const winnerIndex = items.length;
    items.push({ ...winner });

    for (let i = 0; i < SPIN_TAIL_CARDS; i++) {
      items.push({ ...visualRandomItem(selected, items) });
    }

    return { items, winnerIndex };
  }

  function buildStripFromItems(items) {
    reelStrip.innerHTML = '';

    for (let i = 0; i < items.length; i++) {
      const card = document.createElement('div');
      card.className = 'reel-item';
      card.style.height = CARD_H + 'px';
      card.innerHTML =
        `<img src="${items[i].img || ''}" onerror="this.style.display='none'">` +
        `<div class="reel-name">${escapeHtml(items[i].name)}</div>`;
      reelStrip.appendChild(card);
    }
  }

  function centeredYForIndex(index) {
    const viewportCenter = reelViewport.clientHeight / 2;
    const cardCenter = index * CARD_H + CARD_H / 2;
    return viewportCenter - cardCenter;
  }

  function updateNearCenterHighlight() {
    const viewHeight = reelViewport.offsetHeight;
    const centerY = viewHeight / 2;
    const cards = reelStrip.children;

    for (let i = 0; i < cards.length; i++) {
      const cardTop = currentY + i * CARD_H;
      const cardCenter = cardTop + CARD_H / 2;

      if (Math.abs(cardCenter - centerY) < CARD_H * 0.68) {
        cards[i].classList.add('near-center');
      } else {
        cards[i].classList.remove('near-center');
      }
    }
  }

  // Courbe "case opening" :
  // départ très rapide, puis longue décélération dans les derniers mètres.
  function caseOpeningEase(t) {
    return 1 - Math.pow(1 - t, 4.35);
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function animateReel(fromY, toY, duration, easing, onDone) {
    const startTime = performance.now();

    function frame(now) {
      const elapsed = now - startTime;
      const t = Math.min(1, elapsed / duration);
      const eased = easing(t);

      currentY = fromY + (toY - fromY) * eased;
      reelStrip.style.transform = `translate3d(0, ${currentY}px, 0)`;
      updateNearCenterHighlight();

      if (t < 1) {
        animFrame = requestAnimationFrame(frame);
        return;
      }

      animFrame = null;
      currentY = toY;
      reelStrip.style.transform = `translate3d(0, ${currentY}px, 0)`;
      updateNearCenterHighlight();

      if (onDone) onDone();
    }

    animFrame = requestAnimationFrame(frame);
  }

  function revealWinnerWithDelay(winnerItem, winnerIndex) {
    if (revealTimeout) clearTimeout(revealTimeout);

    revealTimeout = setTimeout(() => {
      const all = reelStrip.children;

      for (let i = 0; i < all.length; i++) {
        all[i].classList.remove('winner-glow', 'near-center');
      }

      // Le gagnant est connu : on éclaire exactement sa carte,
      // au lieu de recalculer "la plus proche" après la physique.
      if (all[winnerIndex]) {
        all[winnerIndex].classList.add('winner-glow');
      }

      if (weaponLabel) weaponLabel.innerHTML = winnerItem.name;
      if (resultImg) resultImg.src = winnerItem.img || '';
      if (resultName) resultName.textContent = winnerItem.name;

      if (resultDisplay) {
        resultDisplay.classList.add('active');
      }

      addToHistory(winnerItem);

      setTimeout(() => {
        if (resultDisplay) resultDisplay.classList.remove('active');
      }, 3000);

      revealTimeout = null;
    }, 420);
  }

  function finishSpin(winnerItem, winnerIndex) {
    spinning = false;
    spinBtn.disabled = false;
    spinBtn.innerHTML = 'LANCER LE TIRAGE';

    reelViewport.classList.remove('is-spinning', 'is-settling');

    revealWinnerWithDelay(winnerItem, winnerIndex);
  }

  function startSpin() {
    if (spinning) return;

    if (animFrame) {
      cancelAnimationFrame(animFrame);
      animFrame = null;
    }

    if (stopTimeout) {
      clearTimeout(stopTimeout);
      stopTimeout = null;
    }

    if (revealTimeout) {
      clearTimeout(revealTimeout);
      revealTimeout = null;
    }

    const selected = getSelectedItems();
    if (selected.length === 0) return;

    // 1) Tirage équitable du résultat.
    const winnerItem = { ...chooseWinner(selected) };

    // 2) Création d'un ruban visuel autour de ce résultat.
    const spinStrip = buildCaseOpeningStrip(selected, winnerItem);
    currentStripItems = spinStrip.items;
    currentWinnerIndex = spinStrip.winnerIndex;

    buildStripFromItems(currentStripItems);

    // On commence avec une carte située vers le centre,
    // ce qui évite un départ visuel "collé en haut".
    const startIndex = 2;
    const startY = centeredYForIndex(startIndex);

    // Arrêt exact : centre de la carte gagnante = ligne jaune.
    const targetY = centeredYForIndex(currentWinnerIndex);

    // Petit dépassement final comme sur un case opening.
    // Le gagnant passe légèrement au-dessus de la ligne puis revient se verrouiller.
    const overshootPixels = 10 + Math.random() * 8;
    const overshootY = targetY - overshootPixels;

    currentY = startY;
    reelStrip.style.transform = `translate3d(0, ${currentY}px, 0)`;

    spinning = true;
    spinBtn.disabled = true;
    spinBtn.innerHTML = 'TIRAGE EN COURS...';
    weaponLabel.innerHTML = 'TIRAGE EN COURS...';

    reelViewport.classList.remove('is-settling');
    reelViewport.classList.add('is-spinning');

    if (resultDisplay) resultDisplay.classList.remove('active');

    const cards = reelStrip.children;
    for (let i = 0; i < cards.length; i++) {
      cards[i].classList.remove('winner-glow', 'near-center');
    }

    updateNearCenterHighlight();

    // Durée légèrement variable pour éviter un ressenti mécanique identique à chaque clic.
    const mainDuration = 5000 + Math.random() * 850;

    // 3) Grande décélération.
    animateReel(
      startY,
      overshootY,
      mainDuration,
      caseOpeningEase,
      () => {
        reelViewport.classList.remove('is-spinning');
        reelViewport.classList.add('is-settling');

        // 4) Petit retour de verrouillage sur la ligne centrale.
        animateReel(
          overshootY,
          targetY,
          210,
          easeOutCubic,
          () => finishSpin(winnerItem, currentWinnerIndex)
        );
      }
    );
  }

  function renderReel() {
    if (spinning) return;

    const selected = getSelectedItems();

    reelViewport.classList.remove('is-spinning', 'is-settling');
    currentWinnerIndex = -1;

    if (selected.length === 0) {
      reelStrip.innerHTML =
        '<div class="reel-item"><div>Aucun élément sélectionné</div></div>';
      spinBtn.disabled = true;
      return;
    }

    // Aperçu court avant le spin.
    const preview = [];
    const previewCount = Math.max(8, Math.min(16, selected.length * 2));

    for (let i = 0; i < previewCount; i++) {
      preview.push({ ...selected[i % selected.length] });
    }

    buildStripFromItems(preview);

    // Centre une carte de l'aperçu sur la ligne plutôt que de démarrer à 0.
    const previewIndex = Math.min(2, preview.length - 1);
    currentY = centeredYForIndex(previewIndex);
    reelStrip.style.transform = `translate3d(0, ${currentY}px, 0)`;

    updateNearCenterHighlight();
    spinBtn.disabled = false;
  }

  // ==================== CATÉGORIES ====================
  function renderCategories() {
    if (!categoriesListEl || typeof DESTINY_DATA === 'undefined') return;
    const cats = DESTINY_DATA.categories;
    categoriesListEl.innerHTML = Object.keys(cats).map(k => `<div class="roulette-item" data-category="${k}"><div class="item-icon">${cats[k].logo ? `<img src="${cats[k].logo}" alt="${cats[k].title}">` : ''}</div><div class="item-info"><div class="item-title">${cats[k].title}</div><div class="item-sub">${(DESTINY_DATA.items[k] || []).length} items</div></div></div>`).join('');
    document.querySelectorAll('.roulette-item').forEach(el => { el.addEventListener('click', () => { const cat = el.dataset.category; selectCategory(cat); }); });
    if (Object.keys(cats).length && !currentCategory) selectCategory(Object.keys(cats)[0]);
  }
  function selectCategory(catKey) {
    if (spinning) return;
    currentCategory = catKey;
    const src = DESTINY_DATA.items[catKey] || [];
    currentItems = src.map(i => ({ ...i, checked: true }));
    if (resultDisplay) resultDisplay.classList.remove('active');
    document.querySelectorAll('.roulette-item').forEach(el => { if (el.dataset.category === catKey) el.classList.add('active'); else el.classList.remove('active'); });
    renderItemsList();
    renderReel();
    if (weaponLabel) { const info = DESTINY_DATA.categories[currentCategory]; weaponLabel.innerHTML = info ? info.title : currentCategory?.toUpperCase() || 'SÉLECTIONNE UNE CATÉGORIE'; }
  }

  // ==================== MODAL JOUEUR ====================
  function openPlayerModal() { if (playerModal) { playerModal.classList.add('active'); playerNameInput.focus(); } }
  function closePlayerModal() { playerModal.classList.remove('active'); playerNameInput.value = ''; }
  function addPlayer() { const name = playerNameInput?.value.trim(); if (!name) return; players.push({ id: nextPlayerId++, name, items: [] }); renderPlayers(); closePlayerModal(); }

  // ==================== INITIALISATION ====================
  function init() {
    if (typeof DESTINY_DATA === 'undefined') { console.error('data.js non chargé !'); if (weaponLabel) weaponLabel.innerHTML = 'ERREUR : data.js manquant'; return; }
    players = Storage.loadPlayers(); history = Storage.loadHistory();
    if (players.length === 0) players = [];
    if (players.length) nextPlayerId = Math.max(...players.map(p => p.id)) + 1;
    renderCategories(); renderPlayers(); renderHistory();
    spinBtn?.addEventListener('click', startSpin);
    clearHistoryBtn?.addEventListener('click', clearHistory);
    addPlayerBtn?.addEventListener('click', openPlayerModal);
    cancelModalBtn?.addEventListener('click', closePlayerModal);
    confirmModalBtn?.addEventListener('click', addPlayer);
    checkAllBtn?.addEventListener('click', checkAll);
    uncheckAllBtn?.addEventListener('click', uncheckAll);
    exportPngBtn?.addEventListener('click', exportToPNG);
    searchBar?.addEventListener('input', (e) => { searchQuery = e.target.value; renderItemsList(); });
    confirmYesBtn?.addEventListener('click', () => { if (pendingConfirmCallback) pendingConfirmCallback(true); hideConfirm(); });
    confirmNoBtn?.addEventListener('click', () => { if (pendingConfirmCallback) pendingConfirmCallback(false); hideConfirm(); });
    playerModal?.addEventListener('click', (e) => { if (e.target === playerModal) closePlayerModal(); });
    confirmDialog?.addEventListener('click', (e) => { if (e.target === confirmDialog) hideConfirm(); });
    playerNameInput?.addEventListener('keypress', (e) => { if (e.key === 'Enter') addPlayer(); });
    console.log('Application prête - ' + players.length + ' joueurs, ' + history.length + ' historiques');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
</body>
