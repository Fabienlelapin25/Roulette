<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Destiny 2 - Loadout Manager</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0e;
      font-family: 'Segoe UI', 'Rajdhani', monospace;
      height: 100vh;
      overflow: hidden;
      color: #c8c8d8;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ===== BANNIÈRE SUPÉRIEURE ===== */
    .players-banner {
      background: #0c0c10;
      border-bottom: 1px solid #2a2a35;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 90px;
    }

    .players-list {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      flex: 1;
    }

    .player-card {
      background: #14141c;
      border: 1px solid #3a3a48;
      min-width: 180px;
      padding: 8px 12px;
      position: relative;
      transition: 0.15s;
    }

    .player-card.drag-over {
      border-color: #aa88ff;
      background: #1c1c28;
      box-shadow: 0 0 10px rgba(170, 136, 255, 0.2);
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2a2a35;
    }

    .player-name {
      font-weight: bold;
      color: #aa88ff;
      font-size: 13px;
      text-transform: uppercase;
    }

    .remove-player {
      background: none;
      border: none;
      color: #6a6a7a;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
    }

    .remove-player:hover {
      color: #ff8888;
    }

    .player-items {
      min-height: 60px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .player-item {
      background: #1a1a24;
      border-left: 2px solid #aa88ff;
      padding: 4px 8px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
    }

    .player-item:active {
      cursor: grabbing;
    }

    .remove-item {
      background: none;
      border: none;
      color: #6a6a7a;
      cursor: pointer;
      font-size: 12px;
    }

    .remove-item:hover {
      color: #ff8888;
    }

    .empty-player {
      color: #6a6a7a;
      font-size: 10px;
      text-align: center;
      padding: 12px;
      font-style: italic;
    }

    .add-player-btn {
      background: #14141c;
      border: 1px solid #3a3a48;
      color: #aa88ff;
      padding: 8px 16px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      transition: 0.15s;
      white-space: nowrap;
    }

    .add-player-btn:hover {
      background: #1c1c26;
      border-color: #8866cc;
    }

    /* ===== CONTENU PRINCIPAL ===== */
    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* PANEL GAUCHE */
    .roulettes-panel {
      width: 260px;
      background: #0f0f14;
      border-right: 1px solid #2a2a35;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a35;
      background: #0c0c10;
    }

    .panel-header h2 {
      font-size: 12px;
      color: #aa88ff;
      letter-spacing: 2px;
    }

    .roulettes-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .roulette-item {
      background: #14141c;
      border: 1px solid #2a2a35;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.15s;
    }

    .roulette-item:hover {
      background: #1c1c26;
      border-color: #8866cc;
    }

    .roulette-item.active {
      background: #1a1a24;
      border-left: 3px solid #aa77ff;
    }

    .item-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0e;
      border: 1px solid #3a3a48;
    }

    .item-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .item-title {
      font-size: 13px;
      font-weight: 600;
      color: #d0d0e0;
    }

    .item-sub {
      font-size: 10px;
      color: #88889a;
    }

    /* PANEL CENTRAL */
    .roulette-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0e;
    }

    .slot-machine {
      text-align: center;
      padding: 24px;
    }

    .weapon-label {
      font-size: 14px;
      margin-bottom: 16px;
      color: #aa88ff;
      background: #0f0f14;
      padding: 10px 20px;
      border: 1px solid #2a2a35;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .reel-viewport {
      width: 260px;
      height: 300px;
      margin: 0 auto;
      overflow: hidden;
      background: #0f0f14;
      border: 2px solid #3a3a48;
    }

    .reel-strip {
      display: flex;
      flex-direction: column;
    }

    .reel-item {
      height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #14141c;
      gap: 12px;
    }

    .reel-item img {
      max-width: 160px;
      max-height: 160px;
      object-fit: contain;
    }

    .reel-item .reel-name {
      font-size: 13px;
      font-weight: bold;
      color: #d0d0e0;
      text-align: center;
      padding: 0 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-spin {
      margin-top: 24px;
      background: #14141c;
      border: 2px solid #3a3a48;
      padding: 12px 32px;
      font-size: 15px;
      font-weight: bold;
      color: #aa88ff;
      cursor: pointer;
      font-family: monospace;
      letter-spacing: 4px;
      transition: 0.15s;
    }

    .btn-spin:hover {
      background: #1c1c26;
      border-color: #8866cc;
    }

    .btn-spin:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* PANEL DROIT */
    .selections-panel {
      width: 280px;
      background: #0f0f14;
      border-left: 1px solid #2a2a35;
      display: flex;
      flex-direction: column;
    }

    .selections-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a35;
      background: #0c0c10;
    }

    .selections-header h3 {
      color: #aa88ff;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .selections-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .selection-item {
      background: #14141c;
      border: 1px solid #2a2a35;
      padding: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: grab;
      transition: 0.1s;
    }

    .selection-item:active {
      cursor: grabbing;
    }

    .selection-item.dragging {
      opacity: 0.4;
    }

    .selection-item img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      background: #0a0a0e;
      border: 1px solid #3a3a48;
    }

    .selection-info {
      flex: 1;
    }

    .selection-name {
      font-size: 11px;
      font-weight: 600;
      color: #d0d0e0;
      text-transform: uppercase;
    }

    .selection-category {
      font-size: 9px;
      color: #aa88ff;
      text-transform: uppercase;
    }

    .clear-btn {
      background: #14141c;
      border: 1px solid #4a3a5a;
      color: #aa88aa;
      padding: 8px;
      cursor: pointer;
      font-size: 10px;
      width: calc(100% - 24px);
      margin: 0 12px 12px 12px;
      text-transform: uppercase;
    }

    .clear-btn:hover {
      background: #1c1c26;
      border-color: #ff8888;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0f0f14;
    }
    ::-webkit-scrollbar-thumb {
      background: #3a3a48;
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #14141c;
      border: 1px solid #8866cc;
      padding: 24px;
      min-width: 300px;
    }

    .modal-content h3 {
      color: #aa88ff;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      background: #0a0a0e;
      border: 1px solid #3a3a48;
      color: #c8c8d8;
      margin-bottom: 16px;
      font-family: monospace;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-buttons button {
      background: #1c1c26;
      border: 1px solid #3a3a48;
      color: #c8c8d8;
      padding: 6px 16px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .modal-buttons button.confirm {
      border-color: #aa88ff;
      color: #aa88ff;
    }

    /* Animation picked */
    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      80% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .picked {
      animation: pop 0.4s ease-out;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .roulettes-panel { width: 220px; }
      .selections-panel { width: 240px; }
      .player-card { min-width: 150px; }
      .reel-viewport { width: 220px; height: 260px; }
      .reel-item { height: 260px; }
      .reel-item img { max-width: 130px; max-height: 130px; }
    }

    @media (max-width: 768px) {
      .main-content { flex-direction: column; }
      .roulettes-panel { width: 100%; max-height: 150px; flex-direction: row; overflow-x: auto; }
      .roulettes-list { flex-direction: row; overflow-x: auto; }
      .roulette-item { min-width: 120px; }
      .selections-panel { width: 100%; max-height: 200px; }
      .players-banner { order: 2; }
      .main-content { order: 1; }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- BANNIÈRE SUPÉRIEURE - PLAYERS -->
  <div class="players-banner">
    <div class="players-list" id="playersList"></div>
    <button class="add-player-btn" id="addPlayerBtn">+ AJOUTER JOUEUR</button>
  </div>

  <!-- CONTENU PRINCIPAL -->
  <div class="main-content">
    <!-- PANEL GAUCHE - Catégories -->
    <div class="roulettes-panel">
      <div class="panel-header">
        <h2>CATÉGORIES</h2>
      </div>
      <div class="roulettes-list" id="categoriesList"></div>
    </div>

    <!-- PANEL CENTRAL - Roulette -->
    <div class="roulette-panel">
      <div class="slot-machine">
        <div class="weapon-label" id="weaponLabel">SÉLECTIONNE UNE CATÉGORIE</div>
        <div class="reel-viewport" id="reelViewport">
          <div class="reel-strip" id="reelStrip"></div>
        </div>
        <button class="btn-spin" id="spinBtn" disabled>SPIN</button>
      </div>
    </div>

    <!-- PANEL DROIT - Historique -->
    <div class="selections-panel">
      <div class="selections-header">
        <h3>HISTORIQUE (DRAG & DROP)</h3>
      </div>
      <div class="selections-list" id="selectionsList"></div>
      <div style="padding: 12px;">
        <button class="clear-btn" id="clearHistory">EFFACER L'HISTORIQUE</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL pour ajouter un joueur -->
<div class="modal" id="playerModal">
  <div class="modal-content">
    <h3>AJOUTER UN JOUEUR</h3>
    <input type="text" id="playerNameInput" placeholder="Pseudo du gardien" autocomplete="off">
    <div class="modal-buttons">
      <button id="cancelModal">ANNULER</button>
      <button id="confirmModal" class="confirm">AJOUTER</button>
    </div>
  </div>
</div>

<!-- MODAL pour confirmation -->
<div class="modal" id="confirmModalDialog">
  <div class="modal-content" style="max-width: 300px;">
    <h3>CONFIRMER</h3>
    <p id="confirmMessage">Voulez-vous continuer ?</p>
    <div class="modal-buttons">
      <button id="confirmNo">NON</button>
      <button id="confirmYes" class="confirm">OUI</button>
    </div>
  </div>
</div>

<!-- CHARGEMENT DES DONNÉES -->
<script src="data.js"></script>

<!-- SCRIPT PRINCIPAL -->
<script>
  // Vérification que les données sont chargées
  if (typeof DESTINY_DATA === 'undefined') {
    console.error('data.js non chargé ! Vérifie que le fichier existe à côté de index.html');
  } else {
    console.log('Données chargées :', Object.keys(DESTINY_DATA.categories));
  }

  // ==================== STORAGE ====================
  const STORAGE_KEYS = {
    PLAYERS: 'destiny_players',
    HISTORY: 'destiny_history'
  };

  const Storage = {
    savePlayers(players) {
      try {
        localStorage.setItem(STORAGE_KEYS.PLAYERS, JSON.stringify(players));
        return true;
      } catch(e) { return false; }
    },
    loadPlayers() {
      try {
        const data = localStorage.getItem(STORAGE_KEYS.PLAYERS);
        return data ? JSON.parse(data) : [];
      } catch(e) { return []; }
    },
    saveHistory(history) {
      try {
        localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(history.slice(0, 50)));
        return true;
      } catch(e) { return false; }
    },
    loadHistory() {
      try {
        const data = localStorage.getItem(STORAGE_KEYS.HISTORY);
        return data ? JSON.parse(data) : [];
      } catch(e) { return []; }
    }
  };

  // ==================== ÉTAT GLOBAL ====================
  let players = [];
  let history = [];
  let currentCategory = null;
  let currentItems = [];
  let spinning = false;
  let nextPlayerId = 1;
  let draggedItem = null;
  let pendingConfirmCallback = null;
  let spinTimeout = null;
  
  // DOM Elements
  const playersListEl = document.getElementById('playersList');
  const categoriesListEl = document.getElementById('categoriesList');
  const selectionsListEl = document.getElementById('selectionsList');
  const weaponLabel = document.getElementById('weaponLabel');
  const reelStrip = document.getElementById('reelStrip');
  const reelViewport = document.getElementById('reelViewport');
  const spinBtn = document.getElementById('spinBtn');
  const clearHistoryBtn = document.getElementById('clearHistory');
  const addPlayerBtn = document.getElementById('addPlayerBtn');
  
  // Modals
  const playerModal = document.getElementById('playerModal');
  const confirmDialog = document.getElementById('confirmModalDialog');
  const playerNameInput = document.getElementById('playerNameInput');
  const cancelModalBtn = document.getElementById('cancelModal');
  const confirmModalBtn = document.getElementById('confirmModal');
  const confirmYesBtn = document.getElementById('confirmYes');
  const confirmNoBtn = document.getElementById('confirmNo');
  const confirmMessage = document.getElementById('confirmMessage');
  
  // ==================== FONCTIONS UTILITAIRES ====================
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  function showConfirm(message, callback) {
    confirmMessage.textContent = message;
    confirmDialog.classList.add('active');
    pendingConfirmCallback = callback;
  }
  
  function hideConfirm() {
    confirmDialog.classList.remove('active');
    pendingConfirmCallback = null;
  }
  
  // ==================== GESTION DES JOUEURS ====================
  function renderPlayers() {
    if (!playersListEl) return;
    
    if (players.length === 0) {
      playersListEl.innerHTML = '<div style="color: #6a6a7a; font-size: 12px; padding: 8px;">Aucun joueur - cliquez sur "Ajouter joueur"</div>';
      return;
    }
    
    playersListEl.innerHTML = players.map(player => `
      <div class="player-card" data-player-id="${player.id}">
        <div class="player-header">
          <span class="player-name">${escapeHtml(player.name)}</span>
          <button class="remove-player" data-id="${player.id}">✕</button>
        </div>
        <div class="player-items" data-player-id="${player.id}">
          ${player.items.length === 0 ? '<div class="empty-player">Déposez ici ▼</div>' : 
            player.items.map((item, idx) => `
              <div class="player-item" data-item-idx="${idx}" data-item-name="${escapeHtml(item.name)}" data-item-img="${item.img || ''}" data-item-cat="${item.category || ''}" draggable="true">
                <span>${escapeHtml(item.name)}</span>
                <button class="remove-item" data-player-id="${player.id}" data-item-idx="${idx}">✕</button>
              </div>
            `).join('')}
        </div>
      </div>
    `).join('');
    
    document.querySelectorAll('.remove-player').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(btn.dataset.id);
        showConfirm(`Supprimer le joueur ?`, (confirmed) => {
          if (confirmed) {
            players = players.filter(p => p.id !== id);
            renderPlayers();
            Storage.savePlayers(players);
          }
        });
      });
    });
    
    document.querySelectorAll('.remove-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const playerId = parseInt(btn.dataset.playerId);
        const itemIdx = parseInt(btn.dataset.itemIdx);
        const player = players.find(p => p.id === playerId);
        if (player && player.items[itemIdx]) {
          showConfirm(`Retirer "${player.items[itemIdx].name}" de ${player.name} ?`, (confirmed) => {
            if (confirmed) {
              player.items.splice(itemIdx, 1);
              renderPlayers();
              Storage.savePlayers(players);
            }
          });
        }
      });
    });
    
    setupDropZones();
    setupPlayerItemDrag();
    Storage.savePlayers(players);
  }
  
  function addItemToPlayer(playerId, item) {
    const player = players.find(p => p.id === playerId);
    if (player) {
      player.items.push({ ...item });
      renderPlayers();
      Storage.savePlayers(players);
    }
  }
  
  // ==================== DRAG & DROP ====================
  function setupDropZones() {
    const dropZones = document.querySelectorAll('.player-items');
    dropZones.forEach(zone => {
      zone.removeEventListener('dragover', zone._dragOverHandler);
      zone.removeEventListener('dragleave', zone._dragLeaveHandler);
      zone.removeEventListener('drop', zone._dropHandler);
      
      zone._dragOverHandler = (e) => {
        e.preventDefault();
        zone.closest('.player-card')?.classList.add('drag-over');
      };
      zone._dragLeaveHandler = () => {
        zone.closest('.player-card')?.classList.remove('drag-over');
      };
      zone._dropHandler = (e) => {
        e.preventDefault();
        zone.closest('.player-card')?.classList.remove('drag-over');
        const playerId = parseInt(zone.dataset.playerId);
        if (draggedItem && playerId) {
          addItemToPlayer(playerId, draggedItem);
          draggedItem = null;
        }
      };
      
      zone.addEventListener('dragover', zone._dragOverHandler);
      zone.addEventListener('dragleave', zone._dragLeaveHandler);
      zone.addEventListener('drop', zone._dropHandler);
    });
  }
  
  function setupPlayerItemDrag() {
    document.querySelectorAll('.player-item').forEach(item => {
      item.setAttribute('draggable', 'true');
      item.removeEventListener('dragstart', item._dragStartHandler);
      item.removeEventListener('dragend', item._dragEndHandler);
      
      item._dragStartHandler = (e) => {
        const playerCard = item.closest('.player-card');
        const playerId = parseInt(playerCard?.dataset.playerId);
        const itemIdx = parseInt(item.dataset.itemIdx);
        const player = players.find(p => p.id === playerId);
        if (player && player.items[itemIdx]) {
          draggedItem = player.items[itemIdx];
          e.dataTransfer.setData('text/plain', JSON.stringify(draggedItem));
        }
      };
      item._dragEndHandler = () => {
        draggedItem = null;
      };
      
      item.addEventListener('dragstart', item._dragStartHandler);
      item.addEventListener('dragend', item._dragEndHandler);
    });
  }
  
  // ==================== HISTORIQUE ====================
  function addToHistory(item) {
    history.unshift({
      ...item,
      id: item.id || Date.now(),
      time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
    });
    if (history.length > 50) history.pop();
    renderHistory();
    Storage.saveHistory(history);
  }
  
  function clearHistory() {
    showConfirm('Effacer tout l\'historique ?', (confirmed) => {
      if (confirmed) {
        history = [];
        renderHistory();
        Storage.saveHistory(history);
      }
    });
  }
  
  function renderHistory() {
    if (!selectionsListEl) return;
    
    if (history.length === 0) {
      selectionsListEl.innerHTML = '<div style="text-align: center; color: #6a6a7a; padding: 32px;">Aucun tirage</div>';
      return;
    }
    
    selectionsListEl.innerHTML = history.map((item, idx) => `
      <div class="selection-item" draggable="true" data-item-idx="${idx}" data-item-name="${escapeHtml(item.name)}" data-item-img="${item.img || ''}" data-item-cat="${item.category || ''}">
        <img src="${item.img || ''}" onerror="this.style.display='none'">
        <div class="selection-info">
          <div class="selection-name">${escapeHtml(item.name)}</div>
          <div class="selection-category">${escapeHtml(item.category?.toUpperCase() || 'GÉNÉRAL')}</div>
        </div>
      </div>
    `).join('');
    
    document.querySelectorAll('.selection-item').forEach(el => {
      el.setAttribute('draggable', 'true');
      el.removeEventListener('dragstart', el._dragStartHandler);
      el.removeEventListener('dragend', el._dragEndHandler);
      
      el._dragStartHandler = (e) => {
        const name = el.dataset.itemName;
        const img = el.dataset.itemImg;
        const cat = el.dataset.itemCat;
        draggedItem = { name, img, category: cat };
        e.dataTransfer.setData('text/plain', JSON.stringify(draggedItem));
        el.classList.add('dragging');
      };
      el._dragEndHandler = () => {
        el.classList.remove('dragging');
        draggedItem = null;
      };
      
      el.addEventListener('dragstart', el._dragStartHandler);
      el.addEventListener('dragend', el._dragEndHandler);
    });
  }
  
  // ==================== ROULETTE ====================
  function renderReel() {
    if (!reelStrip || !currentItems.length) {
      if (reelStrip) reelStrip.innerHTML = '<div class="reel-item"><div>Aucun élément</div></div>';
      return;
    }
    
    reelStrip.innerHTML = '';
    // 5 copies pour un effet plus fluide
    for (let i = 0; i < 5; i++) {
      currentItems.forEach(item => {
        const div = document.createElement('div');
        div.className = 'reel-item';
        div.innerHTML = `
          <img src="${item.img || ''}" alt="${escapeHtml(item.name)}" onerror="this.style.display='none'">
          <div class="reel-name">${escapeHtml(item.name)}</div>
        `;
        reelStrip.appendChild(div);
      });
    }
    reelStrip.style.transform = 'translateY(0px)';
  }
  
  function resetReel() {
    renderReel();
    if (currentItems.length > 0 && weaponLabel && currentCategory) {
      const catInfo = DESTINY_DATA.categories[currentCategory];
      weaponLabel.innerHTML = catInfo ? catInfo.title : currentCategory?.toUpperCase() || 'SÉLECTIONNE UNE CATÉGORIE';
    }
  }
  
  function spin() {
    if (spinning || !currentItems.length) return;
    
    // Annuler un timeout précédent
    if (spinTimeout) clearTimeout(spinTimeout);
    
    spinning = true;
    spinBtn.disabled = true;
    spinBtn.innerHTML = 'SPINNING...';
    
    const stepHeight = 300;
    const selectedIndex = Math.floor(Math.random() * currentItems.length);
    const cycles = 6 + Math.floor(Math.random() * 4);
    const totalDistance = (cycles * currentItems.length + selectedIndex) * stepHeight;
    const duration = 2000;
    const startTime = performance.now();
    
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }
    
    function animate(now) {
      const elapsed = now - startTime;
      const progress = Math.min(1, elapsed / duration);
      const ease = easeOutCubic(progress);
      const currentY = -ease * totalDistance;
      
      if (reelStrip) reelStrip.style.transform = `translateY(${currentY}px)`;
      
      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        // Position finale exacte
        const finalY = -selectedIndex * stepHeight;
        if (reelStrip) reelStrip.style.transform = `translateY(${finalY}px)`;
        
        const selectedItem = currentItems[selectedIndex];
        if (weaponLabel) weaponLabel.innerHTML = selectedItem.name;
        
        // Afficher le résultat
        if (reelViewport) {
          // Sauvegarder le contenu original
          const originalHTML = reelStrip?.innerHTML || '';
          
          // Afficher le résultat en grand
          reelViewport.innerHTML = `
            <div class="reel-item picked" style="height:300px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;">
              <img src="${selectedItem.img || ''}" style="max-width:180px; max-height:180px; object-fit:contain;" onerror="this.style.display='none'">
              <div style="font-size:16px; font-weight:bold; color:#aa88ff; text-transform:uppercase; letter-spacing:1px;">${escapeHtml(selectedItem.name)}</div>
            </div>
          `;
          
          // Ajouter à l'historique
          addToHistory(selectedItem);
          
          // Remettre la roulette après 2.5 secondes
          spinTimeout = setTimeout(() => {
            if (reelViewport && reelStrip) {
              reelViewport.innerHTML = '';
              reelViewport.appendChild(reelStrip);
              resetReel();
            }
            spinning = false;
            spinBtn.disabled = false;
            spinBtn.innerHTML = 'SPIN';
            spinTimeout = null;
          }, 2500);
        } else {
          spinning = false;
          spinBtn.disabled = false;
          spinBtn.innerHTML = 'SPIN';
        }
      }
    }
    
    resetReel();
    requestAnimationFrame(animate);
  }
  
  // ==================== CATÉGORIES ====================
  function renderCategories() {
    if (!categoriesListEl || typeof DESTINY_DATA === 'undefined') return;
    
    const categories = DESTINY_DATA.categories;
    categoriesListEl.innerHTML = Object.keys(categories).map(key => `
      <div class="roulette-item" data-category="${key}">
        <div class="item-icon">${categories[key].logo ? `<img src="${categories[key].logo}" alt="${categories[key].title}">` : ''}</div>
        <div class="item-info">
          <div class="item-title">${categories[key].title}</div>
          <div class="item-sub">${getItemsByCategory(key).length} items</div>
        </div>
      </div>
    `).join('');
    
    document.querySelectorAll('.roulette-item').forEach(el => {
      el.addEventListener('click', () => {
        const category = el.dataset.category;
        selectCategory(category);
      });
    });
    
    if (Object.keys(categories).length > 0 && !currentCategory) {
      selectCategory(Object.keys(categories)[0]);
    }
  }
  
  function selectCategory(categoryKey) {
    if (spinning) return;
    
    currentCategory = categoryKey;
    currentItems = getItemsByCategory(categoryKey);
    
    document.querySelectorAll('.roulette-item').forEach(el => {
      if (el.dataset.category === categoryKey) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });
    
    spinBtn.disabled = currentItems.length === 0;
    resetReel();
  }
  
  // ==================== MODAL JOUEUR ====================
  function openPlayerModal() {
    if (playerModal) {
      playerModal.classList.add('active');
      if (playerNameInput) playerNameInput.focus();
    }
  }
  
  function closePlayerModal() {
    if (playerModal) playerModal.classList.remove('active');
    if (playerNameInput) playerNameInput.value = '';
  }
  
  function addPlayer() {
    const name = playerNameInput?.value.trim();
    if (!name) return;
    
    players.push({
      id: nextPlayerId++,
      name: name,
      items: []
    });
    renderPlayers();
    closePlayerModal();
  }
  
  // ==================== INITIALISATION ====================
  function init() {
    if (typeof DESTINY_DATA === 'undefined') {
      console.error('Impossible de démarrer : data.js non chargé !');
      if (weaponLabel) weaponLabel.innerHTML = 'ERREUR : data.js manquant';
      return;
    }
    
    players = Storage.loadPlayers();
    history = Storage.loadHistory();
    
    // Plus de GUARDIAN_01/02 par défaut - liste vide
    if (players.length === 0) {
      players = [];
      nextPlayerId = 1;
    }
    
    if (players.length > 0) {
      nextPlayerId = Math.max(...players.map(p => p.id)) + 1;
    }
    
    renderCategories();
    renderPlayers();
    renderHistory();
    
    if (spinBtn) spinBtn.addEventListener('click', spin);
    if (clearHistoryBtn) clearHistoryBtn.addEventListener('click', clearHistory);
    if (addPlayerBtn) addPlayerBtn.addEventListener('click', openPlayerModal);
    if (cancelModalBtn) cancelModalBtn.addEventListener('click', closePlayerModal);
    if (confirmModalBtn) confirmModalBtn.addEventListener('click', addPlayer);
    
    if (confirmYesBtn) {
      confirmYesBtn.addEventListener('click', () => {
        if (pendingConfirmCallback) pendingConfirmCallback(true);
        hideConfirm();
      });
    }
    
    if (confirmNoBtn) {
      confirmNoBtn.addEventListener('click', () => {
        if (pendingConfirmCallback) pendingConfirmCallback(false);
        hideConfirm();
      });
    }
    
    if (playerModal) {
      playerModal.addEventListener('click', (e) => {
        if (e.target === playerModal) closePlayerModal();
      });
    }
    
    if (confirmDialog) {
      confirmDialog.addEventListener('click', (e) => {
        if (e.target === confirmDialog) hideConfirm();
      });
    }
    
    if (playerNameInput) {
      playerNameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addPlayer();
      });
    }
    
    console.log('Application prête - ' + players.length + ' joueurs, ' + history.length + ' historiques');
  }
  
  // Démarrer l'application quand le DOM est prêt
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
</body>
</html>
